<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDEA Classroom Walkthrough</title>
<style>
  :root{--navy:#1F2D3A;--ink:#28323C;--grey:#5B6B7A;--line:#D6DEE4;--bg:#F4F6F8;
    --orange:#E07A2F;--teal:#2E7D9A;--purple:#6A4C93;--green:#2E9E5B;--amber:#C8801B;--red:#C0492E;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Helvetica,Arial,sans-serif;line-height:1.45}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  header.masthead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px}
  header.masthead img{height:62px;width:auto}
  header.masthead .ttl{font-family:Georgia,serif;font-weight:700;color:var(--navy);font-size:26px;line-height:1.1}
  header.masthead .sub{color:var(--grey);font-size:13px;margin-top:2px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px}
  .card h2{font-family:Georgia,serif;color:var(--navy);font-size:18px;margin:0 0 4px}
  .step-no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;font-weight:700;margin-right:8px}
  .muted{color:var(--grey);font-size:13px}
  label.fld{display:block;font-weight:700;color:var(--navy);font-size:13px;margin:10px 0 4px;letter-spacing:.3px}
  input[type=text],textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal)}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:14px;flex-wrap:wrap}.row>div{flex:1 1 200px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;transition:.12s}
  .chip:hover{border-color:var(--teal)}
  .chip.sel{color:#fff;border-color:transparent}
  .chip.sel.t-eng{background:var(--purple)}.chip.sel.t-hum{background:var(--orange)}.chip.sel.t-mas{background:var(--teal)}.chip.sel.t-ss{background:var(--navy)}
  .chip.sel.strat{background:var(--navy)}
  .hidden{display:none}
  .lf{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.lf:first-child{border-top:none}
  .lf .txt{flex:1 1 auto;font-size:15px}.lf select{width:168px;flex:0 0 auto}
  .accent-bar{height:6px;border-radius:6px;margin:-18px -20px 14px;border-top-left-radius:16px;border-top-right-radius:16px}
  .stmt{background:#EEF4F7;border:1px solid var(--teal);border-radius:10px;padding:12px 14px;font-size:15px}
  .stratbox{background:#FBEEE2;border:1px solid var(--orange);border-radius:10px;padding:12px 14px;font-weight:700;color:var(--navy)}
  .btn{display:inline-block;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--grey)}
  .pill{background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:12px}
  .banner{background:#FFF7E8;border:1px solid var(--amber);border-radius:10px;padding:10px 14px;font-size:13px;color:#7a5600;margin-top:16px}
  .ok{background:#EAF6EF;border:1px solid var(--green);color:#1f7a45}.err{background:#FBECE8;border:1px solid var(--red);color:var(--red)}
  .sec-h{font-family:Georgia,serif;color:var(--navy);font-size:16px;margin:18px 0 6px}
  .chkgrp{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
  .chkgrp h4{margin:0 0 6px;font-size:13px;color:var(--grey);letter-spacing:.5px;text-transform:uppercase}
  .chk{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:14px;cursor:pointer}
  .chk input{width:18px;height:18px;margin-top:1px;flex:0 0 auto;accent-color:var(--teal)}
  .rubric{overflow-x:auto;border:1px solid var(--line);border-radius:12px;padding:10px}
  .rubric table{border-collapse:separate;border-spacing:6px;min-width:680px;width:100%}
  .rubric .dim{font-weight:700;color:var(--navy);font-size:13px;width:150px;vertical-align:middle;padding-right:4px}
  .rubric .lvlhead{font-size:12px;font-weight:700;color:var(--grey);text-align:center;padding-bottom:2px}
  .rcell{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.3;cursor:pointer;vertical-align:top;background:#fff;min-width:150px}
  .rcell:hover{border-color:var(--teal)}.rcell.sel{color:#fff}.rcell.sel .rc-l{color:#fff}
  .rc-l{display:block;font-weight:700;font-size:11px;color:var(--grey);margin-bottom:3px}
</style>
</head>

const TEAM_CLASS={}, TEAM_COLOR={};
TEAM_ORDER.forEach(t=>{const k=t.indexOf("Engineering")===0?"t-eng":t.indexOf("Humanities")===0?"t-hum":t.indexOf("Math")===0?"t-mas":"t-ss";
  TEAM_CLASS[t]=k;TEAM_COLOR[t]={ "t-eng":"#6A4C93","t-hum":"#E07A2F","t-mas":"#2E7D9A","t-ss":"#1F2D3A"}[k];});
function scopeOf(team){return TEAM_FORMAT[team]==="perteacher" ? "strategy" : "team";}

let state={observer:"",team:"",strategy:"",teacher:null,ratings:{},checks:{},otherText:"",rubric:{},capturedAt:null};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(d){return d.toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});}
setInterval(()=>{$("liveClock").textContent=fmt(new Date());},1000);$("liveClock").textContent=fmt(new Date());
$("observer").addEventListener("input",e=>{state.observer=e.target.value.trim();});

const teamChips=$("teamChips");
TEAM_ORDER.forEach(team=>{const c=document.createElement("button");c.className="chip";c.textContent=team;c.onclick=()=>selectTeam(team,c);teamChips.appendChild(c);});
function clearSel(cont){[...cont.children].forEach(ch=>ch.classList.remove("sel","t-eng","t-hum","t-mas","t-ss","strat"));}

function selectTeam(team,chip){
  state.team=team;state.strategy="";state.teacher=null;
  clearSel(teamChips);chip.classList.add("sel",TEAM_CLASS[team]);
  const sc=$("strategyChips");sc.innerHTML="";
  (TEAM_STRATEGIES[team]||[]).forEach(strat=>{const c=document.createElement("button");c.className="chip";c.textContent=strat;c.onclick=()=>selectStrategy(strat,c);sc.appendChild(c);});
  $("cardStrategy").classList.remove("hidden");$("cardTeacher").classList.add("hidden");$("cardWalk").classList.add("hidden");
}
function teacherList(){
  if(scopeOf(state.team)==="strategy") return DATA.filter(r=>r.team===state.team && r.strategy===state.strategy);
  // team-wide: unique teachers of this team
  const seen={},out=[];
  DATA.filter(r=>r.team===state.team).forEach(r=>{ if(!seen[r.teacher]){seen[r.teacher]=1;out.push(r);} });
  return out;
}
function selectStrategy(strat,chip){
  state.strategy=strat;state.teacher=null;
  clearSel($("strategyChips"));chip.classList.add("sel","strat");
  const sel=$("teacherSel");sel.innerHTML='<option value="">Select teacher…</option>';
  const teachers=teacherList();
  if(teachers.length===0){const o=document.createElement("option");o.disabled=true;o.textContent="(No teachers for this selection)";sel.appendChild(o);}
  teachers.forEach((r,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=r.teacher;sel.appendChild(o);});
  // reset class/period
  buildClassControl(null);$("periodInput").value="";
  $("cardTeacher").classList.remove("hidden");$("cardWalk").classList.add("hidden");
}
function buildClassControl(teacher){
  const host=$("classHost");
  if(!teacher){ host.innerHTML='<label class="fld" for="classSel">Class</label><select id="classSel" disabled><option value="">Select class…</option></select>'; return; }
  const cls=teacher.classes||[];
  if(cls.length>0){
    let h='<label class="fld" for="classSel">Class</label><select id="classSel"><option value="">Select class…</option>';
    cls.forEach(c=>{h+='<option value="'+esc(c)+'">'+esc(c)+'</option>';});
    h+='</select>'; host.innerHTML=h;
  } else {
    host.innerHTML='<label class="fld" for="classText">Class / setting</label><input type="text" id="classText" placeholder="Type the class or setting">';
  }
}
function getClassValue(){const s=$("classSel"),t=$("classText");return s?s.value.trim():(t?t.value.trim():"");}

$("teacherSel").addEventListener("change",e=>{
  const teachers=teacherList();
  if(e.target.value===""){state.teacher=null;buildClassControl(null);$("cardWalk").classList.add("hidden");return;}
  state.teacher=teachers[parseInt(e.target.value,10)];
  buildClassControl(state.teacher);
  renderWalk();
});

function renderWalk(){
  const col=TEAM_COLOR[state.team]||"#1F2D3A";
  $("walkBar").style.background=col;
  $("wTeam").textContent=state.team;$("wTeacher").textContent=state.teacher.teacher;
  $("wStrategy").textContent=state.strategy;
  state.ratings={};state.checks={};state.otherText="";state.rubric={};
  const host=$("moduleHost");host.innerHTML="";
  const f=TEAM_FORMAT[state.team];
  if(f==="humanities" && HUM_FORMS[state.strategy]) renderHumanities(host,HUM_FORMS[state.strategy],col);
  else if(f==="lookfors_team" && MS_FORMS[state.strategy]) renderLookForsTeam(host,MS_FORMS[state.strategy],col);
  else renderPerTeacher(host,state.teacher,col);
  $("result").classList.add("hidden");$("cardWalk").classList.remove("hidden");
  $("cardWalk").scrollIntoView({behavior:"smooth",block:"start"});
}

function renderLFRows(container,arr){
  arr.forEach((lf,i)=>{
    const row=document.createElement("div");row.className="lf";
    const txt=document.createElement("div");txt.className="txt";txt.textContent=(i+1)+". "+lf;
    const sel=document.createElement("select");RATINGS.forEach(r=>{const o=document.createElement("option");o.value=r.v;o.textContent=r.t;sel.appendChild(o);});
    sel.onchange=()=>{state.ratings[i]=sel.value;};
    row.appendChild(txt);row.appendChild(sel);container.appendChild(row);
  });
}
/* E&D / Student Services: per-teacher look-fors + comments */
function renderPerTeacher(host,t,col){
  host.innerHTML='<label class="fld" style="margin-top:14px">Student statement</label><div class="stmt">'+esc(t.studentStatement||"—")+'</div>'+
    '<label class="fld" style="margin-top:14px">Look-fors</label><div id="wLookFors"></div>'+
    '<label class="fld" for="comments" style="margin-top:14px">Comments / quick note</label><textarea id="comments" placeholder="Brief observation note…"></textarea>';
  renderLFRows($("wLookFors"), t.lookFors||[]);
}
/* Math & Science: team-wide look-fors + open-ended prompts */
function renderLookForsTeam(host,form,col){
  let h='';
  if(form.focus) h+='<label class="fld" style="margin-top:14px">Focus</label><div class="stmt">'+esc(form.focus)+'</div>';
  h+='<label class="fld" style="margin-top:14px">Look-fors</label><div id="wLookFors"></div>';
  MS_QUESTION_GROUPS.forEach((g,gi)=>{
    h+='<div class="sec-h">'+esc(g.label)+'</div>';
    g.items.forEach((it,ii)=>{ h+='<label class="fld" for="q_'+gi+'_'+ii+'">'+esc(it.q)+'</label><textarea id="q_'+gi+'_'+ii+'" placeholder="'+esc(it.ph||"")+'"></textarea>'; });
  });
  host.innerHTML=h;
  renderLFRows($("wLookFors"), form.lookFors||[]);
}
/* Humanities: checkboxes + open questions + tap-to-select rubric */
function renderHumanities(host,form,col){
  const parts=[];
  parts.push('<div class="sec-h">'+esc(form.checkboxTitle)+'</div>');
  form.checkboxGroups.forEach((g,gi)=>{
    parts.push('<div class="chkgrp">'+(g.label?('<h4>'+esc(g.label)+'</h4>'):''));
    g.items.forEach((it,ii)=>{const id='chk_'+gi+'_'+ii;
      parts.push('<label class="chk" for="'+id+'"><input type="checkbox" id="'+id+'" data-g="'+gi+'" data-i="'+ii+'"><span>'+esc(it)+'</span></label>');});
    if(g.other){parts.push('<label class="chk" for="chk_other_'+gi+'"><input type="checkbox" id="chk_other_'+gi+'" data-other="1"><span>Other:</span></label><input type="text" id="otherText" placeholder="Describe other method…" style="margin-top:4px">');}
    parts.push('</div>');
  });
  parts.push('<div class="sec-h">'+esc(form.questionsTitle)+'</div>');
  form.questions.forEach((q,i)=>{parts.push('<label class="fld" for="q_'+i+'">'+esc(q)+'</label><textarea id="q_'+i+'" placeholder="Short answer…"></textarea>');});
  parts.push('<div class="sec-h">'+esc(form.rubricTitle)+' <span class="muted" style="font-weight:400">— tap a box to select</span></div>');
  parts.push('<div class="rubric"><table><thead><tr><th></th>');
  form.rubricLevels.forEach(l=>parts.push('<th class="lvlhead">'+esc(l)+'</th>'));
  parts.push('</tr></thead><tbody>');
  form.rubricRows.forEach((row,ri)=>{
    parts.push('<tr><td class="dim">'+esc(row.dim)+'</td>');
    row.cells.forEach((cell,ci)=>{parts.push('<td class="rcell" data-dim="'+esc(row.dim)+'" data-ri="'+ri+'" data-ci="'+ci+'"><span class="rc-l">'+esc(form.rubricLevels[ci])+'</span>'+esc(cell)+'</td>');});
    parts.push('</tr>');
  });
  parts.push('</tbody></table></div>');
  host.innerHTML=parts.join("");
  host.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.onchange=()=>{ if(cb.dataset.other){state.checks['other']=cb.checked;return;} state.checks[cb.dataset.g+'_'+cb.dataset.i]=cb.checked; };});
  const ot=$("otherText"); if(ot){ot.oninput=()=>{state.otherText=ot.value;};}
  host.querySelectorAll('.rcell').forEach(c=>{c.onclick=()=>{
    const ri=c.dataset.ri;
    host.querySelectorAll('.rcell[data-ri="'+ri+'"]').forEach(x=>{x.classList.remove('sel');x.style.background='#fff';x.style.borderColor='';});
    c.classList.add('sel');c.style.background=col;c.style.borderColor=col;state.rubric[c.dataset.dim]=parseInt(c.dataset.ci,10);
  };});
}

function buildPayload(){
  state.capturedAt=new Date();
  const t=state.teacher, f=TEAM_FORMAT[state.team];
  const base={observer:state.observer,submittedAtISO:state.capturedAt.toISOString(),submittedAt:fmt(state.capturedAt),
    format:f,team:state.team,strategy:state.strategy,teacher:t.teacher,teacherEmail:t.email||"",
    classTitle:getClassValue(),period:$("periodInput").value.trim()};
  if(f==="humanities"){
    const form=HUM_FORMS[state.strategy];const checked=[];
    form.checkboxGroups.forEach((g,gi)=>{g.items.forEach((it,ii)=>{if(state.checks[gi+'_'+ii])checked.push((g.label?g.label+": ":"")+it);});});
    if(state.checks['other']&&state.otherText.trim())checked.push("Other: "+state.otherText.trim());
    const answers=form.questions.map((q,i)=>({question:q,answer:($("q_"+i)?$("q_"+i).value.trim():"")}));
    const rubric=form.rubricRows.map(r=>{const ci=state.rubric[r.dim];return {dimension:r.dim,level:(ci==null?"":(ci+1)),levelLabel:(ci==null?"":form.rubricLevels[ci])};});
    const rubricSummary=rubric.filter(x=>x.level!=="").map(x=>x.dimension+": "+x.levelLabel).join("\n");
    const detailsSummary="METHODS / LOOK-FORS OBSERVED:\n"+(checked.length?checked.map(c=>"• "+c).join("\n"):"(none marked)")+
      "\n\n"+form.questionsTitle.toUpperCase()+":\n"+answers.map(a=>a.question+"\n"+(a.answer||"—")).join("\n\n")+
      "\n\nRUBRIC:\n"+(rubricSummary||"(none selected)");
    return Object.assign(base,{methodsChecked:checked,checkedSummary:checked.join("; "),questions:answers,
      q1:answers[0]?answers[0].answer:"",q2:answers[1]?answers[1].answer:"",q3:answers[2]?answers[2].answer:"",
      rubric:rubric,rubricSummary:rubricSummary,
      comments:(form.questionsTitle==="Comments"&&answers[0]?answers[0].answer:""),detailsSummary:detailsSummary});
  } else if(f==="lookfors_team"){
    const form=MS_FORMS[state.strategy];
    const lf=(form.lookFors||[]).map((text,i)=>({index:i+1,lookFor:text,rating:(state.ratings[i]||""),ratingLabel:(RATINGS.find(r=>r.v===(state.ratings[i]||""))||{}).t||""}));
    const answers=[];MS_QUESTION_GROUPS.forEach((g,gi)=>{g.items.forEach((it,ii)=>{const el=$("q_"+gi+"_"+ii);answers.push({question:it.q,answer:el?el.value.trim():""});});});
    const detailsSummary=(form.focus?"FOCUS: "+form.focus+"\n\n":"")+
      "LOOK-FORS:\n"+lf.map(x=>`${x.index}. [${x.rating||"-"}] ${x.lookFor}`).join("\n")+
      "\n\nOBSERVATION NOTES:\n"+answers.map(a=>a.question+"\n"+(a.answer||"—")).join("\n\n");
    return Object.assign(base,{focus:form.focus||"",lookFors:lf,
      lookForsSummary:lf.map(x=>`${x.index}. [${x.rating||"-"}] ${x.lookFor}`).join("\n"),
      questions:answers,comments:"",detailsSummary:detailsSummary});
  } else {
    const lf=(t.lookFors||[]).map((text,i)=>({index:i+1,lookFor:text,rating:(state.ratings[i]||""),ratingLabel:(RATINGS.find(r=>r.v===(state.ratings[i]||""))||{}).t||""}));
    const comments=$("comments")?$("comments").value.trim():"";
    return Object.assign(base,{studentStatement:t.studentStatement||"",lookFors:lf,
      lookFor1:lf[0]?lf[0].lookFor:"",rating1:lf[0]?lf[0].rating:"",lookFor2:lf[1]?lf[1].lookFor:"",rating2:lf[1]?lf[1].rating:"",
      lookFor3:lf[2]?lf[2].lookFor:"",rating3:lf[2]?lf[2].rating:"",lookFor4:lf[3]?lf[3].lookFor:"",rating4:lf[3]?lf[3].rating:"",
      lookForsSummary:lf.map(x=>`${x.index}. [${x.rating||"-"}] ${x.lookFor}`).join("\n"),
      detailsSummary:"STUDENT STATEMENT: "+(t.studentStatement||"")+"\n\nLOOK-FORS:\n"+lf.map(x=>`${x.index}. [${x.rating||"-"}] ${x.lookFor}`).join("\n")+(comments?("\n\nCOMMENTS:\n"+comments):""),
      comments:comments});
  }
}
function validate(){
  if(!state.observer) return "Please enter the observer's name (Step 1).";
  if(!state.team) return "Please select a PLC team (Step 2).";
  if(!state.strategy) return "Please select a strategy (Step 3).";
  if(!state.teacher) return "Please select the teacher (Step 4).";
  if(!getClassValue()) return "Please choose or enter the class/setting (Step 4).";
  if(!$("periodInput").value.trim()) return "Please enter the period (Step 4).";
  return "";
}
function showResult(cls,html){const r=$("result");r.className="banner "+cls;r.innerHTML=html;r.classList.remove("hidden");}
$("submitBtn").addEventListener("click",async()=>{
  const err=validate();if(err){showResult("err",err);return;}
  const payload=buildPayload();$("submitBtn").disabled=true;$("submitBtn").textContent="Submitting…";
  if(!FLOW_URL){showResult("err","No Power Automate URL is configured yet (FLOW_URL is blank). Use <b>Download a copy</b> for now, or add the flow URL to this file.");$("submitBtn").disabled=false;$("submitBtn").textContent="Submit walkthrough";return;}
  try{
    await fetch(FLOW_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload)});
    showResult("ok","<b>Submitted.</b> Saved to OneDrive and emailed to "+(payload.teacherEmail||"the teacher")+".<br><span class='muted'>If you don't see it, use Download a copy as a backup.</span>");
    $("submitBtn").textContent="Submitted ✓";
  }catch(e){showResult("err","Could not reach the flow. Check FLOW_URL and your connection. Use <b>Download a copy</b> as a backup.");$("submitBtn").disabled=false;$("submitBtn").textContent="Submit walkthrough";}
});
$("downloadBtn").addEventListener("click",()=>{
  const err=validate();if(err){showResult("err",err);return;}
  const p=buildPayload();const blob=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="walkthrough_"+(p.teacher+"_"+p.classTitle).replace(/[^A-Za-z0-9]+/g,"_")+".json";a.click();
});
$("resetBtn").addEventListener("click",()=>{location.reload();});
</script>
