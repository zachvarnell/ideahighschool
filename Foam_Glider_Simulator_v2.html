<!DOCTYPE html>
<!-- iDEA AS Foam Board Glider Simulator v1.1 · 2026-10-18 · v1.1: optional canard and optional winglets added; everything else unchanged. See README.md in this folder. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foam Board Glider Simulator</title>
<style>
:root{
  --bg:#000; --panel:#050b07; --line:#39ff6a; --dim:#1d7a38; --faint:#0f3a1c;
  --amber:#ffb000; --white:#e9ffef; --cyan:#46d9ff; --red:#ff5a4f;
  --font:"Consolas","Lucida Console","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--line);font-family:var(--font);font-size:13px}
button,select,input,textarea{font-family:var(--font);font-size:13px}
button{background:#000;color:var(--line);border:1px solid var(--dim);padding:4px 10px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--line);outline:none;background:#052010}
button.primary{border-color:var(--line);color:#000;background:var(--line);font-weight:bold}
button.primary:hover{background:#7dff9f}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:#000;color:var(--white);border:1px solid var(--dim);padding:3px 5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--line)}
input.bad{border-color:var(--amber);color:var(--amber)}
#app{display:flex;flex-direction:column;height:100vh;min-height:520px}
header{display:flex;align-items:center;gap:10px;padding:5px 8px;border-bottom:1px solid var(--dim);flex:0 0 auto;flex-wrap:wrap}
header h1{font-size:15px;margin:0 6px 0 0;letter-spacing:2px;color:var(--line);white-space:nowrap}
#designTitle{color:var(--white);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:2px;margin-left:auto}
nav button{border-bottom:none;letter-spacing:1px}
nav button.on{background:var(--line);color:#000;font-weight:bold}
.filebtns{display:flex;gap:4px;position:relative}
#exampleMenu{position:absolute;top:28px;left:0;background:#000;border:1px solid var(--line);z-index:5;display:none;min-width:250px}
#exampleMenu button{display:block;width:100%;text-align:left;border:none}
main{flex:1 1 auto;display:flex;min-height:0}
aside{width:320px;flex:0 0 320px;border-right:1px solid var(--dim);overflow-y:auto;padding:6px 8px;background:var(--panel)}
.tab{flex:1 1 auto;min-width:0;display:none;padding:6px}
.tab.on{display:grid}
h2{font-size:12px;letter-spacing:2px;margin:6px 0 4px;color:var(--line);border-bottom:1px solid var(--faint);padding-bottom:2px}
h3{font-size:12px;margin:8px 0 3px;color:var(--white);letter-spacing:1px}
/* parts list */
.part{display:flex;align-items:center;gap:6px;padding:3px 4px;border:1px solid transparent;cursor:pointer;color:var(--dim)}
.part:hover{border-color:var(--faint);color:var(--line)}
.part.sel{border-color:var(--line);color:var(--line);background:#031a0b}
.part .glyph{width:14px;text-align:center}
.part input[type=checkbox]{margin:0 0 0 auto;accent-color:#39ff6a}
.fields{margin-top:6px;border-top:1px solid var(--faint);padding-top:4px}
.field{display:grid;grid-template-columns:1fr 92px 40px;align-items:center;gap:4px;margin:3px 0}
.field label{color:var(--white)}
.field input,.field select{width:100%}
.field .unit{color:var(--dim)}
.field.wide{grid-template-columns:1fr}
.help{color:var(--dim);font-size:11.5px;margin:0 0 6px 0;line-height:1.3}
.note{color:var(--dim);font-size:11.5px;line-height:1.35}
/* views */
.view{position:relative;border:1px solid var(--faint);min-height:0;min-width:0;overflow:hidden}
.view canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.view .vlabel{position:absolute;left:6px;top:3px;font-size:11px;letter-spacing:2px;color:var(--dim);pointer-events:none}
#tab-design{grid-template-columns:3fr 2fr;grid-template-rows:1fr 1fr;gap:6px}
#readouts{overflow-y:auto;border:1px solid var(--faint);padding:6px 8px;min-height:0}
.ro{display:grid;grid-template-columns:1fr auto;gap:2px 8px;line-height:1.45}
.ro .k{color:var(--dim)}
.ro .v{color:var(--white);text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:0 5px;border:1px solid currentColor;font-size:11px;margin-left:4px}
.good{color:var(--line)} .warn{color:var(--amber)} .badc{color:var(--red)} .info{color:var(--cyan)}
.warnlist{margin:6px 0 0;padding:0;list-style:none}
.warnlist li{margin:4px 0;padding-left:14px;text-indent:-14px;line-height:1.3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:4px}
/* flight */
#tab-flight{grid-template-columns:1fr 1fr 280px;grid-template-rows:1.15fr 1fr;gap:6px}
#vSide{grid-column:1/3;grid-row:1}
#vTop{grid-column:1;grid-row:2}
#vRear{grid-column:2;grid-row:2}
#results{grid-column:3;grid-row:1/3;border:1px solid var(--faint);padding:6px 8px;overflow-y:auto;min-height:0}
#chart{width:100%;height:120px;display:block;border:1px solid var(--faint);margin-top:6px}
.bigbtn{width:100%;padding:8px;font-size:15px;letter-spacing:3px;margin:8px 0 4px}
.seg{display:flex;gap:2px;margin:4px 0}
.seg button{flex:1;padding:3px 0}
.seg button.on{background:var(--dim);color:#000;border-color:var(--line)}
/* template */
#tab-template{grid-template-columns:1fr 300px;gap:6px}
#tplPreview{border:1px solid var(--faint);background:#000;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:0}
#tplPreview svg{background:#fff;max-width:100%;max-height:100%;height:auto}
#tplSteps{border:1px solid var(--faint);padding:6px 8px;overflow-y:auto;min-height:0}
#tplSteps ol{padding-left:18px;margin:4px 0}
#tplSteps li{margin:4px 0;line-height:1.35;color:var(--white)}
/* tests */
#tab-tests{grid-template-columns:1fr 290px;grid-template-rows:auto 1fr;gap:6px}
#testTableWrap{grid-column:1;grid-row:1/3;overflow:auto;border:1px solid var(--faint);min-height:0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--faint);padding:3px 5px;text-align:right;white-space:nowrap;font-size:12px}
th{color:var(--dim);font-weight:normal;position:sticky;top:0;background:#000}
td{color:var(--white)}
td.l,th.l{text-align:left}
#testSummary{border:1px solid var(--faint);padding:6px 8px}
#testChartWrap{border:1px solid var(--faint);position:relative;min-height:0}
#testChart{position:absolute;left:0;top:0;width:100%;height:100%}
.x{border:none;color:var(--dim);padding:0 4px}
.x:hover{color:var(--red)}
#toast{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);color:var(--white);padding:6px 12px;display:none;z-index:9}
#printArea{display:none}
.blist{border:1px solid var(--faint);padding:4px;margin:4px 0}
.bitem{border-bottom:1px solid var(--faint);padding:3px 0 5px}
.bitem:last-child{border-bottom:none}
.brow{display:grid;grid-template-columns:1fr 58px 58px 22px;gap:4px;align-items:center}
.brow input,.brow select{width:100%}
.bhead{display:grid;grid-template-columns:1fr 58px 58px 22px;gap:4px;color:var(--dim);font-size:11px}
@media print{
  #app,#toast{display:none!important}
  #printArea{display:block}
  html,body{background:#fff;margin:0}
  .page{page-break-after:always;break-after:page;position:relative;overflow:hidden}
  .page:last-child{page-break-after:auto;break-after:auto}
}
</style>
<style id="pageStyle">@page{size:letter portrait;margin:0}</style>
</head>
<body>
<div id="app">
  <header>
    <h1>FOAM BOARD GLIDER SIMULATOR</h1>
    <span id="designTitle"></span>
    <div class="filebtns">
      <button id="btnNew" title="Start from an example design">New ▾</button>
      <div id="exampleMenu" role="menu">
        <button data-ex="folded">Foam Glider One (airfoil wing)</button>
        <button data-ex="flat">Flat-Wing Trainer</button>
        <button data-ex="winglets">Foam Glider One + winglets</button>
        <button data-ex="canard">Canard Glider (forward wing)</button>
      </div>
      <button id="btnOpen" title="Open a saved design file">Open</button>
      <button id="btnSave" title="Download this design as a file">Save</button>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
    </div>
    <nav>
      <button data-tab="design" class="on">DESIGN</button>
      <button data-tab="flight">FLIGHT</button>
      <button data-tab="template">CUTTING TEMPLATE</button>
      <button data-tab="tests">TEST FLIGHTS</button>
    </nav>
  </header>
  <main>
    <aside id="aside"></aside>
    <section class="tab on" id="tab-design">
      <div class="view" id="dTop"><canvas></canvas><span class="vlabel">TOP VIEW</span></div>
      <div class="view" id="dRear"><canvas></canvas><span class="vlabel">REAR VIEW</span></div>
      <div class="view" id="dSide"><canvas></canvas><span class="vlabel">SIDE VIEW (FROM LEFT)</span></div>
      <div id="readouts"></div>
    </section>
    <section class="tab" id="tab-flight">
      <div class="view" id="vSide"><canvas></canvas><span class="vlabel">SIDE VIEW</span></div>
      <div class="view" id="vTop"><canvas></canvas><span class="vlabel">TOP VIEW</span></div>
      <div class="view" id="vRear"><canvas></canvas><span class="vlabel">REAR VIEW</span></div>
      <div id="results"></div>
    </section>
    <section class="tab" id="tab-template">
      <div id="tplPreview"></div>
      <div id="tplSteps"></div>
    </section>
    <section class="tab" id="tab-tests">
      <div id="testTableWrap"></div>
      <div id="testSummary"></div>
      <div id="testChartWrap"><canvas id="testChart"></canvas></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
/* =====================================================================
   Foam Board Glider Simulator — physics engine
   ---------------------------------------------------------------------
   Coordinate systems
   DESIGN (millimeters):  X = distance aft from the nose,  Y = toward the
                          right wing tip,  Z = up.  The top edge of the
                          fuselage is Z = 0; the wing and stabilizer sit there.
   BODY   (meters):       x = forward, y = right, z = down
   WORLD  (meters):       x = downrange, y = right of launch line, z = down

   Method
   - Wing, stabilizer, fin and fuselage are cut into thin streamwise strips.
     Each strip computes its own lift and drag, including flow from rotation
     (natural damping) and sideslip (dihedral and fin effects).
   - Folded-airfoil wing strips use a cambered-airfoil model: the zero-lift
     angle comes from the camber, which is estimated from the airfoil
     thickness. Flat foam-board surfaces use a thin flat-plate model.
   - Elevator and rudder use thin-airfoil flap theory.
   - Mass comes from the foam board area actually used (sheet mass divided
     by sheet area), plus hot glue, tape and ballast.
   - Flight: 6-degree-of-freedom rigid body, RK4 integration, 1 ms step.
   ===================================================================== */
(function (root) {
  'use strict';

  var G = 9.80665;
  var DEG = Math.PI / 180;
  var OSWALD = 0.85;
  var CN90 = 1.80;
  var GLUE_G_PER_CM = 0.04;   // hot-glue bead about 2.5 mm wide
  var WINGLET_SPAN_GAIN = 0.8; // effective wing-span gain per unit winglet height (estimate, see notes)
  var CANARD_WASH_K = 0.5;     // downwash from the canard at the wing, as a fraction of the far-field value (estimate)

    /* ---------------- small vector helpers ---------------- */
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function len(a) { return Math.sqrt(dot(a, a)); }
  function norm(a) { var l = len(a); return l > 1e-12 ? mul(a, 1 / l) : [0, 0, 0]; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* design millimeters -> body meters */
  function d2b(p) { return [-p[0] / 1000, p[1] / 1000, -p[2] / 1000]; }
  /* design direction -> body direction (no scaling) */
  function dir2b(v) { return [-v[0], v[1], -v[2]]; }

  /* quaternion [w,x,y,z], body -> world */
  function qmul(a, b) {
    return [
      a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
      a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
      a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
      a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]
    ];
  }
  function qnorm(q) {
    var l = Math.sqrt(q[0] * q[0] + q[1] * q[1] + q[2] * q[2] + q[3] * q[3]);
    return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
  }
  function qrot(q, v) { // rotate body vector into world
    var w = q[0], x = q[1], y = q[2], z = q[3];
    var tx = 2 * (y * v[2] - z * v[1]);
    var ty = 2 * (z * v[0] - x * v[2]);
    var tz = 2 * (x * v[1] - y * v[0]);
    return [
      v[0] + w * tx + (y * tz - z * ty),
      v[1] + w * ty + (z * tx - x * tz),
      v[2] + w * tz + (x * ty - y * tx)
    ];
  }
  function qinvrot(q, v) { return qrot([q[0], -q[1], -q[2], -q[3]], v); }
  function qfromEuler(roll, pitch, yaw) {
    var cr = Math.cos(roll / 2), sr = Math.sin(roll / 2);
    var cp = Math.cos(pitch / 2), sp = Math.sin(pitch / 2);
    var cy = Math.cos(yaw / 2), sy = Math.sin(yaw / 2);
    return [
      cr * cp * cy + sr * sp * sy,
      sr * cp * cy - cr * sp * sy,
      cr * sp * cy + sr * cp * sy,
      cr * cp * sy - sr * sp * cy
    ];
  }
  function qtoEuler(q) {
    var w = q[0], x = q[1], y = q[2], z = q[3];
    var roll = Math.atan2(2 * (w * x + y * z), 1 - 2 * (x * x + y * y));
    var pitch = Math.asin(clamp(2 * (w * y - z * x), -1, 1));
    var yaw = Math.atan2(2 * (w * z + x * y), 1 - 2 * (y * y + z * z));
    return [roll, pitch, yaw];
  }

  /* 3x3 helpers for the inertia tensor */
  function m3inv(m) {
    var a = m[0][0], b = m[0][1], c = m[0][2], d = m[1][0], e = m[1][1], f = m[1][2], g = m[2][0], h = m[2][1], i = m[2][2];
    var A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
    var det = a * A + b * B + c * C;
    if (Math.abs(det) < 1e-30) det = 1e-30;
    return [
      [A / det, -(b * i - c * h) / det, (b * f - c * e) / det],
      [B / det, (a * i - c * g) / det, -(a * f - c * d) / det],
      [C / det, -(a * h - b * g) / det, (a * e - b * d) / det]
    ];
  }
  function m3v(m, v) {
    return [m[0][0] * v[0] + m[0][1] * v[1] + m[0][2] * v[2],
            m[1][0] * v[0] + m[1][1] * v[1] + m[1][2] * v[2],
            m[2][0] * v[0] + m[2][1] * v[1] + m[2][2] * v[2]];
  }



  function airDensity(tempC, elevM) {
    var p = 101325 * Math.pow(1 - 2.25577e-5 * clamp(elevM, -400, 8000), 5.25588);
    return p / (287.05 * (tempC + 273.15));
  }
  function airViscosity(tempC) { // Sutherland, Pa·s
    var T = tempC + 273.15;
    return 1.716e-5 * Math.pow(T / 273.15, 1.5) * (273.15 + 110.4) / (T + 110.4);
  }

  /* ---------------- example design ---------------- */
  function exampleGlider() {
    return {
      format: 'foam-glider-design', version: 1,
      name: 'Foam Glider One', designer: '', notes: '',
      board: { w: 508, h: 762, thickness: 4.8, sheetMass: 115 },
      fuselage: { length: 660, height: 50, tailHeight: 22, noseSlope: 70, layers: 2 },
      wing: { x: 140, rootChord: 170, tipChord: 130, semiSpan: 360, sweep: 20, dihedral: 5, incidence: 2, airfoil: 'folded', thickness: 16 },
      hstab: { x: 560, rootChord: 95, tipChord: 70, semiSpan: 140, sweep: 15, incidence: 0, elevChord: 25, elevUp: 0 },
      vstab: { x: 575, rootChord: 85, tipChord: 50, height: 100, sweep: 35, rudderChord: 25, rudderRight: 0 },
      canard: { enabled: false, x: 45, rootChord: 55, tipChord: 40, semiSpan: 90, sweep: 8, incidence: 4 },
      winglets: { enabled: false, height: 45, rootChord: 50, tipChord: 30, sweep: 15, cant: 0 },
      ballast: [{ name: 'US nickel', mass: 5.0, count: 8, x: 25 }],
      glue: { mode: 'auto', mass: 15 },
      tape: { length: 50, gPerM: 3.5, x: 150 },
      launch: { speed: 6, angle: 0, height: 1.8, headwind: 0, temperature: 15, elevation: 100 },
      tests: []
    };
  }
  function sanitize(d) {
    var base = exampleGlider();
    function fill(t, s) {
      for (var k in s) {
        if (!Object.prototype.hasOwnProperty.call(s, k)) continue;
        if (Array.isArray(s[k])) { if (!Array.isArray(t[k])) t[k] = JSON.parse(JSON.stringify(s[k])); continue; }
        if (t[k] === undefined || t[k] === null) t[k] = JSON.parse(JSON.stringify(s[k]));
        else if (typeof s[k] === 'object') fill(t[k], s[k]);
      }
    }
    fill(d, base);
    d.ballast = d.ballast.filter(function (b) { return b && isFinite(b.mass); }).map(function (b) {
      return { name: String(b.name || 'Ballast'), mass: +b.mass || 0, count: Math.max(0, Math.round(+b.count || 0)), x: +b.x || 0 };
    });
    if (!Array.isArray(d.tests)) d.tests = [];
    d.canard.enabled = !!d.canard.enabled;
    d.winglets.enabled = !!d.winglets.enabled;
    return d;
  }

  /* ---------------- aerodynamic helpers ---------------- */
  function liftSlope(AR) { AR = Math.max(AR, 0.2); return 2 * Math.PI * AR / (2 + Math.sqrt(AR * AR + 4)); }
  function lowArBonus(AR) { return 14 * clamp((3 - AR) / 2.5, 0, 1); }
  function flapTheory(cfRatio) {
    cfRatio = clamp(cfRatio, 0.02, 0.9);
    var th = Math.acos(2 * cfRatio - 1);
    return { tau: (Math.PI - th + Math.sin(th)) / Math.PI, cm: -0.5 * Math.sin(th) * (1 - Math.cos(th)) };
  }
  function flatPlate(AR) { return { slope: liftSlope(AR), stall: (9 + lowArBonus(AR)) * DEG, alpha0: 0, cd0: 0.034, AR: AR }; }
  function foldedAirfoil(AR, tc) {
    tc = clamp(tc, 0.03, 0.20);
    var camber = Math.min(0.35 * tc, 0.06);
    // thin-airfoil theory for a cambered section: zero-lift angle -2·camber, Cm(1/4 chord) = -π·camber,
    // pitching moment reduced for finite aspect ratio
    return { slope: liftSlope(AR), stall: (14 + lowArBonus(AR)) * DEG, alpha0: -1.8 * camber, cd0: 0.024, AR: AR, camber: camber,
             cm0: -Math.PI * camber * AR / (AR + 2) };
  }

  /* chord direction (forward) and surface normal for a surface with a given
     span direction and incidence, in design coordinates */
  function frame(spanDirD, incDeg, sg) {
    var i = incDeg * DEG;
    var cD = [-Math.cos(i), 0, Math.sin(i)];
    var nD = mul(cross(spanDirD, cD), sg);
    return { c: dir2b(cD), n: dir2b(norm(nD)) };
  }

  /* fuselage depth below the top edge at distance X from the nose */
  function fuseDepth(d, X) {
    var f = d.fuselage, H = f.height, L = f.length;
    var wTE = clamp(d.wing.x + d.wing.rootChord, 1, L - 1);
    var ns = clamp(f.noseSlope, 0, wTE * 0.9);
    if (X <= 0) return H * 0.4;
    if (X < ns) return H * (0.4 + 0.6 * X / ns);
    if (X <= wTE) return H;
    if (X >= L) return f.tailHeight;
    return H + (f.tailHeight - H) * (X - wTE) / (L - wTE);
  }
  /* top edge of the fuselage: the wing seat and stabilizer seat are cut at
     their incidence angles (front edge raised for positive incidence) */
  function seatRise(chord, incDeg) { return chord * Math.tan(incDeg * DEG); }
  function fuseOutline(d) {
    var f = d.fuselage, L = f.length, w = d.wing, hs = d.hstab;
    var wTE = clamp(w.x + w.rootChord, 1, L - 1);
    var ns = clamp(f.noseSlope, 0, wTE * 0.9);
    var wr = seatRise(w.rootChord, w.incidence), hr = seatRise(hs.rootChord, hs.incidence);
    var top = [[0, 0]];
    var cn = d.canard;
    if (cn && cn.enabled && cn.x + cn.rootChord <= w.x - 0.5) {
      if (cn.x > 0.5) top.push([cn.x, seatRise(cn.rootChord, cn.incidence)]);
      top.push([cn.x + cn.rootChord, 0]);
    }
    if (w.x > 0.5) top.push([w.x, wr]);
    top.push([w.x + w.rootChord, 0]);
    if (hs.x > w.x + w.rootChord + 0.5 && hs.x + hs.rootChord <= L + 0.5) { top.push([hs.x, hr]); top.push([Math.min(L, hs.x + hs.rootChord), 0]); }
    top.push([L, 0]);

    var V = len(vB);
    if (V > 1e-6) {
      geo.bluff.forEach(function (b) {
        var fb = mul(vB, -0.5 * rho * V * b.area * b.cd);
        F = add(F, fb);
        M = add(M, cross(sub(d2b(b.p), cgB), fb));
      });
    }
    return { F: F, M: M };
  }

  /* =====================================================================
     STATIC ANALYSIS
     ===================================================================== */
  function analyze(d) {
    var geo = buildGeometry(d);
    var mp = massProps(geo);
    var rho = airDensity(d.launch.temperature, d.launch.elevation);
    var V = 6;
    function at(alpha, beta) {
      var vB = [V * Math.cos(alpha) * Math.cos(beta), V * Math.sin(beta), V * Math.sin(alpha) * Math.cos(beta)];
      var r = aeroForces(geo, mp.cgB, vB, [0, 0, 0], rho);
      var vhat = norm(vB), up = norm(cross([0, 1, 0], vhat));
      return { F: r.F, M: r.M, L: dot(r.F, up), D: -dot(r.F, vhat) };
    }
    var r1 = at(1 * DEG, 0), r2 = at(3 * DEG, 0);
    var xNP = -(r2.M[1] - r1.M[1]) / (r2.F[2] - r1.F[2]);
    var npX = mp.cg[0] - xNP * 1000;
    var sm = (npX - mp.cg[0]) / geo.mac;

    var trim = null, prev = null;
    for (var aDeg = -10; aDeg <= 40; aDeg += 0.5) {
      var rr = at(aDeg * DEG, 0);
      if (prev && prev.M > 0 && rr.M[1] <= 0 && trim === null) {
        var tt = prev.M / (prev.M - rr.M[1]);
        var aT = prev.a + tt * 0.5, rt = at(aT * DEG, 0);
        trim = { alpha: aT, L: rt.L, D: rt.D };
      }
      prev = { a: aDeg, M: rr.M[1] };
    }
    var W = mp.mass * G, trimSpeed = null, glideRatio = null, glideAngle = null, sinkRate = null;
    if (trim && trim.L > 0) {
      trimSpeed = V * Math.sqrt(W / trim.L);
      glideRatio = trim.L / Math.max(trim.D, 1e-9);
      glideAngle = Math.atan(1 / glideRatio) / DEG;
      sinkRate = trimSpeed * Math.sin(glideAngle * DEG);
    }
    var aRef = (trim ? trim.alpha : 3) * DEG;
    var b0 = at(aRef, 0), bP = at(aRef, 3 * DEG);
    var qS = 0.5 * rho * V * V * geo.wingArea * 1e-6, span = geo.span / 1000;
    var Clb = (bP.M[0] - b0.M[0]) / (qS * span * 3);
    var Cnb = (bP.M[2] - b0.M[2]) / (qS * span * 3);
    var yawTrim = b0.M[2] / (qS * span);

    // classic glider design numbers
    var wingAC = geo.macLE + 0.25 * geo.mac, hAC = geo.hmacLE + 0.25 * geo.hmac;
    var vAC = d.vstab.x + d.vstab.sweep * 0.42 + 0.25 * (d.vstab.rootChord + d.vstab.tipChord) / 2;
    var Vh = geo.Sh * (hAC - wingAC) / (geo.wingArea * geo.mac);
    var Vv = geo.Sv * (vAC - wingAC) / (geo.wingArea * (2 * d.wing.semiSpan));
    var wingLoading = mp.mass * 1000 / (geo.wingArea / 1e4);          // g per dm²
    var Re = trimSpeed ? rho * trimSpeed * geo.mac / 1000 / airViscosity(d.launch.temperature) : null;

    var layout = layoutParts(d, geo, mp.cg[0]);

    var warnings = [];
    if (sm < 0) warnings.push({ level: 'bad', text: 'Unstable: the center of gravity is behind the neutral point. Add ballast near the nose, move the wing back, or enlarge the stabilizer.' });
    else if (sm < 0.05) warnings.push({ level: 'warn', text: 'Barely stable: the center of gravity is very close to the neutral point. Add a little nose ballast.' });
    else if (sm > 0.35) warnings.push({ level: 'warn', text: 'Very nose-heavy: the glider will need a lot of up-elevator and will fly fast and steep.' });
    if (!trim) warnings.push({ level: 'bad', text: 'No balanced flight angle: the glider cannot hold a steady glide. Adjust the elevator, the stabilizer incidence, or the ballast.' });
    else if (trim.alpha - (geo.strips[0].alpha0 / DEG) > geo.strips[0].stall / DEG - 1) warnings.push({ level: 'warn', text: 'The balanced flight angle (' + trim.alpha.toFixed(1) + '°) is close to the wing stall angle. Reduce the up-elevator.' });
    else if (trimSpeed && trimSpeed > 11) warnings.push({ level: 'warn', text: 'The steady glide speed (' + trimSpeed.toFixed(1) + ' m/s) is high for a hand launch. Reduce nose ballast or add a little up-elevator.' });
    if (Vh < 0.30) warnings.push({ level: 'warn', text: 'Small horizontal tail volume (' + Vh.toFixed(2) + '). Enlarge the stabilizer or move it farther back. Typical gliders use 0.35–0.60.' });
    if (Vv < 0.018) warnings.push({ level: 'warn', text: 'Small vertical tail volume (' + Vv.toFixed(3) + '). Enlarge the fin or move it back. Typical gliders use 0.02–0.04.' });
    if (Clb > -0.0002) warnings.push({ level: 'warn', text: 'Weak roll stability: add dihedral (3–8° for a glider with a fin).' });
    if (Cnb < 0.0002) warnings.push({ level: 'warn', text: 'Weak yaw stability: enlarge the fin or move it farther back.' });
    if (geo.folded && d.wing.thickness < 2 * d.board.thickness + 1) warnings.push({ level: 'warn', text: 'The airfoil thickness must be more than two board thicknesses (' + (2 * d.board.thickness + 1).toFixed(1) + ' mm) so there is room for the spar.' });
    if (d.hstab.x + d.hstab.rootChord > d.fuselage.length + 0.5) warnings.push({ level: 'warn', text: 'The stabilizer extends past the end of the fuselage. Lengthen the fuselage or move the stabilizer forward.' });
    if (d.vstab.x + d.vstab.rootChord > d.fuselage.length + 0.5) warnings.push({ level: 'warn', text: 'The fin extends past the end of the fuselage. Lengthen the fuselage or move the fin forward.' });
    if (d.wing.x + d.wing.rootChord > d.hstab.x) warnings.push({ level: 'warn', text: 'The wing overlaps the stabilizer. Move the stabilizer back or the wing forward.' });
    if (d.canard.enabled) {
      var cn = d.canard;
      if (cn.x + cn.rootChord > d.wing.x + 0.5) warnings.push({ level: 'warn', text: 'The canard overlaps the wing. Move the canard forward, make its chord shorter, or move the wing back.' });
      if (cn.incidence <= d.wing.incidence) warnings.push({ level: 'warn', text: 'Set the canard incidence 1–3° above the wing incidence (' + d.wing.incidence + '°). Then the canard stalls first, the nose drops, and the wing keeps flying.' });
      if (cn.semiSpan >= 0.6 * d.wing.semiSpan) warnings.push({ level: 'warn', text: 'The canard span is more than 60 % of the wing span. A smaller canard (about 10–25 % of the wing area) is easier to balance.' });
      warnings.push({ level: 'info', text: 'Canard area is ' + (100 * geo.canard.Sc / geo.wingArea).toFixed(0) + ' % of the wing area. A canard moves the neutral point forward, so check the static margin and add nose ballast if needed.' });
    }
    if (d.winglets.enabled) {
      var wg = geo.winglets;
      if (wg.clamped) warnings.push({ level: 'info', text: 'The winglet root chord is limited to the wing tip chord (' + d.wing.tipChord + ' mm).' });
      if (d.winglets.height > 0.3 * d.wing.semiSpan) warnings.push({ level: 'warn', text: 'Tall winglets (more than 30 % of the half span) load the wing tips and may bend. Shorten them or add a spar.' });
      warnings.push({ level: 'info', text: 'Winglets add about ' + wg.spanGain.toFixed(0) + ' mm of effective span and ' + (wg.area / 100).toFixed(1) + ' cm² of side area. Their effect is an estimate; compare it with test flights.' });
    }
    if (layout.unplaced.length) warnings.push({ level: 'bad', text: 'These parts are larger than one foam board sheet: ' + layout.unplaced.join(', ') + '.' });
    if (layout.sheets.length > 1) warnings.push({ level: 'info', text: 'This design needs ' + layout.sheets.length + ' foam board sheets.' });
    if (Math.abs(d.vstab.rudderRight) > 0.5) warnings.push({ level: 'info', text: 'The rudder is bent: the glider will turn to the ' + (d.vstab.rudderRight > 0 ? 'right.' : 'left.') });

    return {
      geo: geo, mp: mp, rho: rho, npX: npX, sm: sm, mac: geo.mac,
      trim: trim, trimSpeed: trimSpeed, glideRatio: glideRatio, glideAngle: glideAngle, sinkRate: sinkRate,
      Clb: Clb, Cnb: Cnb, yawTrim: yawTrim, Vh: Vh, Vv: Vv, wingLoading: wingLoading, Re: Re,
      layout: layout, warnings: warnings
    };
  }

  /* =====================================================================
     PARTS FOR CUTTING. Each part is drawn in its own flat coordinates
     (u to the right, v downward, millimeters), then packed onto sheets.
     Line types: cut (solid), score (cut the foam, not the bottom paper),
     fold, mark (pencil guide for gluing positions).
     ===================================================================== */
  function makeParts(d, geo, cgX) {
    var w = d.wing, f = d.fuselage, hs = d.hstab, vs = d.vstab, t = d.board.thickness;
    var parts = [];
    function part(name, id, qty) { return { name: name, id: id, qty: qty || 1, outline: [], lines: [], labels: [] }; }

    /* ---- wing ---- */
    var bs = Math.max(w.semiSpan, 10), folded = geo.folded, T = geo.T, wrap = geo.wrap;
    var split = Math.abs(w.dihedral) > 0.1 || 2 * bs > d.board.h - 12;
    function le(s) { return w.sweep * Math.abs(s) / bs; }
    function ch(s) { return w.rootChord + (w.tipChord - w.rootChord) * Math.abs(s) / bs; }
    function topEdge(s) { return le(s) - wrap - 1.02 * ch(s); }
    function wingPiece(s0, s1, name, id, qty) {
      var p = part(name, id, qty);
      var ss = [s0]; if (s0 < 0 && s1 > 0) ss.push(0); ss.push(s1);
      var front = ss.map(function (s) { return [s, folded ? topEdge(s) : le(s)]; });
      var back = ss.slice().reverse().map(function (s) { return [s, le(s) + ch(s)]; });
      p.outline = front.concat(back);
      if (folded) {
        p.lines.push({ type: 'fold', pts: ss.map(function (s) { return [s, le(s)]; }), label: 'LEADING EDGE FOLD' });
        p.lines.push({ type: 'fold', pts: ss.map(function (s) { return [s, le(s) - wrap]; }), label: 'LEADING EDGE FOLD' });
        for (var k = 1; k <= 3; k++) {
          p.lines.push({ type: 'light', pts: ss.map(function (s) { return [s, le(s) - wrap - 0.12 * k * ch(s)]; }), label: k === 2 ? 'LIGHT SCORE · top paper only' : '' });
        }
        p.lines.push({ type: 'mark', pts: ss.map(function (s) { return [s, le(s) + 0.3 * ch(s)]; }), label: 'SPAR POSITION' });
      }
      var sm = (s0 + s1) / 2;
      p.labels.push({ u: sm, v: le(sm) + ch(sm) * 0.62, text: name.toUpperCase(), size: 7 });
      if (folded) p.labels.push({ u: sm, v: topEdge(sm) + ch(sm) * 0.5, text: 'TOP SURFACE (folds over)', size: 4.5 });
      if (s0 >= 0 || s1 <= 0) {
        var rootS = s0 >= 0 ? s0 : s1;
        p.labels.push({ u: rootS + (s0 >= 0 ? 6 : -6), v: le(rootS) + ch(rootS) * 0.35, text: 'ROOT', size: 3.5, rot: -90 });
      }
      return p;
    }
    if (split) {
      parts.push(wingPiece(0, bs, 'Right wing', 'wingR'));
      parts.push(wingPiece(-bs, 0, 'Left wing', 'wingL'));
    } else {
      parts.push(wingPiece(-bs, bs, 'Wing', 'wing'));
    }
    /* ---- spar ---- */
    if (folded && geo.sparH > 0.5) {
      var sp = part('Spar', 'spar', 2);
      var sl = Math.sqrt(bs * bs + Math.pow(w.sweep + 0.3 * (w.tipChord - w.rootChord), 2));
      sp.outline = [[0, 0], [sl, 0], [sl, geo.sparH], [0, geo.sparH]];
      sp.labels.push({ u: sl / 2, v: geo.sparH / 2, text: 'SPAR × 2', size: Math.min(4, geo.sparH * 0.7) });
      parts.push(sp);
    }
    /* ---- fuselage layers ---- */
    var fp = part('Fuselage', 'fuse', Math.max(1, Math.round(f.layers)));
    fp.outline = fuseOutline(d).map(function (q) { return [q[0], -q[1]]; });
    var wr = seatRise(w.rootChord, w.incidence), hr = seatRise(hs.rootChord, hs.incidence);
    fp.lines.push({ type: 'mark', pts: [[w.x, -wr + 2], [w.x + w.rootChord, 2]], label: 'WING' + (Math.abs(w.incidence) > 0.05 ? ' · seat cut at ' + w.incidence + '°' : '') });
    fp.lines.push({ type: 'mark', pts: [[hs.x, -hr + 2], [hs.x + hs.rootChord, 2]], label: 'STABILIZER' + (Math.abs(hs.incidence) > 0.05 ? ' · seat cut at ' + hs.incidence + '°' : '') });
    var fl = Math.max(1, Math.round(f.layers));
    fp.labels.push({ u: f.length * 0.55, v: f.height * 0.5, text: 'FUSELAGE' + (fl > 1 ? ' × ' + fl : ''), size: 6 });
    if (isFinite(cgX)) fp.lines.push({ type: 'balance', pts: [[cgX, 0], [cgX, Math.min(12, f.height * 0.4)]], label: 'BALANCE POINT' });
    d.ballast.forEach(function (b) {
      if (b.count * b.mass <= 0) return;
      fp.lines.push({ type: 'mark', pts: [[b.x, fuseDepth(d, b.x) * 0.25], [b.x, fuseDepth(d, b.x) * 0.75]], label: 'BALLAST' });
    });
    parts.push(fp);
    /* ---- stabilizer ---- */
    var hbs = Math.max(hs.semiSpan, 5), gap = t + 3;
    function hle(s) { return hs.sweep * Math.abs(s) / hbs; }
    function hch(s) { return hs.rootChord + (hs.tipChord - hs.rootChord) * Math.abs(s) / hbs; }
    var hp = part('Stabilizer', 'hstab');
    hp.outline = [[-hbs, hle(-hbs)], [0, 0], [hbs, hle(hbs)], [hbs, hle(hbs) + hch(hbs)], [0, hch(0)], [-hbs, hle(-hbs) + hch(-hbs)]];
    if (hs.elevChord > 0) {
      [1, -1].forEach(function (sg) {
        var ec0 = clamp(hs.elevChord, 1, 0.6 * hch(gap)), ec1 = clamp(hs.elevChord, 1, 0.6 * hch(hbs));
        hp.lines.push({ type: 'score', pts: [[sg * gap, hle(gap) + hch(gap) - ec0], [sg * hbs, hle(hbs) + hch(hbs) - ec1]], label: sg > 0 ? 'SCORE · elevator hinge' : '' });
        hp.lines.push({ type: 'cut', pts: [[sg * gap, hle(gap) + hch(gap)], [sg * gap, hle(gap) + hch(gap) - ec0]] });
      });
    }
    hp.lines.push({ type: 'mark', pts: [[0, 0], [0, hch(0)]], label: 'CENTER' });
    hp.labels.push({ u: hbs * 0.5, v: hle(hbs * 0.5) + hch(hbs * 0.5) * 0.35, text: 'STABILIZER', size: 5 });
    parts.push(hp);
    /* ---- canard ---- */
    var cdn = d.canard;
    if (cdn && cdn.enabled) {
      var cbs2 = Math.max(cdn.semiSpan, 5);
      var cle = function (s) { return cdn.sweep * Math.abs(s) / cbs2; };
      var cch = function (s) { return cdn.rootChord + (cdn.tipChord - cdn.rootChord) * Math.abs(s) / cbs2; };
      var cpp = part('Canard', 'canard');
      cpp.outline = [[-cbs2, cle(-cbs2)], [0, 0], [cbs2, cle(cbs2)], [cbs2, cle(cbs2) + cch(cbs2)], [0, cch(0)], [-cbs2, cle(-cbs2) + cch(-cbs2)]];
      cpp.lines.push({ type: 'mark', pts: [[0, 0], [0, cch(0)]], label: 'CENTER' });
      cpp.labels.push({ u: cbs2 * 0.5, v: cle(cbs2 * 0.5) + cch(cbs2 * 0.5) * 0.4, text: 'CANARD', size: 4.5 });
      parts.push(cpp);
      fp.lines.push({ type: 'mark', pts: [[cdn.x, -seatRise(cdn.rootChord, cdn.incidence) + 2], [cdn.x + cdn.rootChord, 2]], label: 'CANARD' + (Math.abs(cdn.incidence) > 0.05 ? ' · seat cut at ' + cdn.incidence + '°' : '') });
    }
    /* ---- winglets ---- */
    if (geo.winglets) {
      var wi = geo.winglets, wsw = d.winglets.sweep;
      var wpp = part('Winglet', 'winglet', 2);
      wpp.outline = [[0, wi.height], [wsw, 0], [wsw + wi.tipChord, 0], [wi.rootChord, wi.height]];
      wpp.labels.push({ u: (wi.rootChord + wsw) / 2, v: wi.height * 0.6, text: 'WINGLET × 2', size: Math.min(4, wi.rootChord / 9) });
      wpp.labels.push({ u: wi.rootChord * 0.4, v: wi.height - 2.5, text: 'bottom edge (glued to wing tip)', size: 2.4 });
      parts.push(wpp);
    }
    /* ---- fin ---- */
    var vh = Math.max(vs.height, 5);
    var vp = part('Fin', 'vstab');
    vp.outline = [[0, vh], [vs.sweep, 0], [vs.sweep + vs.tipChord, 0], [vs.rootChord, vh]];
    if (vs.rudderChord > 0) {
      var rc0 = clamp(vs.rudderChord, 1, 0.6 * vs.rootChord), rc1 = clamp(vs.rudderChord, 1, 0.6 * vs.tipChord);
      vp.lines.push({ type: 'score', pts: [[vs.rootChord - rc0, vh], [vs.sweep + vs.tipChord - rc1, 0]], label: 'SCORE · rudder hinge' });
    }
    vp.labels.push({ u: (vs.rootChord + vs.sweep) / 2, v: vh * 0.6, text: 'FIN', size: 5 });
    vp.labels.push({ u: vs.rootChord * 0.4, v: vh - 3, text: 'bottom edge', size: 3 });
    parts.push(vp);

    // normalize every part so its bounding box starts at (0,0)
    parts.forEach(function (p) {
      var mnU = Infinity, mnV = Infinity, mxU = -Infinity, mxV = -Infinity;
      p.outline.forEach(function (q) { mnU = Math.min(mnU, q[0]); mnV = Math.min(mnV, q[1]); mxU = Math.max(mxU, q[0]); mxV = Math.max(mxV, q[1]); });
      function sh(q) { return [q[0] - mnU, q[1] - mnV]; }
      p.outline = p.outline.map(sh);
      p.lines.forEach(function (l) { l.pts = l.pts.map(sh); });
      p.labels.forEach(function (l) { var q = sh([l.u, l.v]); l.u = q[0]; l.v = q[1]; });
      p.w = mxU - mnU; p.h = mxV - mnV;
      p.offset = [mnU, mnV];
    });
    return parts;
  }

  /* shelf packing onto foam board sheets (long side horizontal) */
  function layoutParts(d, geo, cgX) {
    var parts = makeParts(d, geo, cgX);
    var SW = Math.max(d.board.w, d.board.h), SH = Math.min(d.board.w, d.board.h);
    var margin = 6, gapP = 8;
    var items = [];
    parts.forEach(function (p) { for (var i = 0; i < p.qty; i++) items.push({ part: p, copy: i + 1 }); });
    // orient each item so its long side runs along the sheet's long side
    items.forEach(function (it) {
      var p = it.part;
      it.rot = (p.h > p.w && p.h <= SW - 2 * margin) ? 1 : 0;
      it.w = it.rot ? p.h : p.w; it.h = it.rot ? p.w : p.h;
    });
    items.sort(function (a, b) { return b.h - a.h || b.w - a.w; });
    var sheets = [], unplaced = [];
    function newSheet() { var s = { shelves: [], items: [], usedH: margin }; sheets.push(s); return s; }
    items.forEach(function (it) {
      if (it.w > SW - 2 * margin || it.h > SH - 2 * margin) {
        // try the other orientation
        var w2 = it.h, h2 = it.w;
        if (w2 <= SW - 2 * margin && h2 <= SH - 2 * margin) { it.rot = 1 - it.rot; it.w = w2; it.h = h2; }
        else { if (unplaced.indexOf(it.part.name) < 0) unplaced.push(it.part.name); return; }
      }
      for (var si = 0; si < sheets.length; si++) {
        var sh = sheets[si];
        for (var k = 0; k < sh.shelves.length; k++) {
          var shelf = sh.shelves[k];
          if (it.h <= shelf.h && shelf.x + it.w <= SW - margin) { it.x = shelf.x; it.y = shelf.y; shelf.x += it.w + gapP; sh.items.push(it); return; }
        }
        if (sh.usedH + it.h <= SH - margin) {
          var ns = { y: sh.usedH, h: it.h, x: margin };
          sh.shelves.push(ns); sh.usedH += it.h + gapP;
          it.x = ns.x; it.y = ns.y; ns.x += it.w + gapP; sh.items.push(it); return;
        }
      }
      var s2 = newSheet();
      var ns2 = { y: margin, h: it.h, x: margin };
      s2.shelves.push(ns2); s2.usedH = margin + it.h + gapP;
      it.x = ns2.x; it.y = ns2.y; ns2.x += it.w + gapP; s2.items.push(it);
    });
    // transform function: part coords -> sheet coords
    sheets.forEach(function (sh) {
      sh.items.forEach(function (it) {
        it.map = function (q) {
          return it.rot ? [it.x + (it.part.h - q[1]), it.y + q[0]] : [it.x + q[0], it.y + q[1]];
        };
      });
    });
    return { sheets: sheets, unplaced: unplaced, sheetW: SW, sheetH: SH, parts: parts };
  }

  /* =====================================================================
     FLIGHT SIMULATION
     ===================================================================== */
  function simulate(d, opts) {
    opts = opts || {};
    var an = analyze(d);
    var geo = an.geo, mp = an.mp, rho = an.rho, L = d.launch;
    var dt = 0.001, tMax = opts.tMax || 60, recDt = 1 / 60;
    var theta = L.angle * DEG, wind = [-(L.headwind || 0), 0, 0];
    var st = { p: [0, 0, -Math.max(L.height, 0.05)], v: [L.speed * Math.cos(theta), 0, -L.speed * Math.sin(theta)], q: qfromEuler(0, theta, 0), w: [0, 0, 0] };
    var m = mp.mass;
    function deriv(s) {
      var vB = qinvrot(s.q, sub(s.v, wind));
      var a = aeroForces(geo, mp.cgB, vB, s.w, rho);
      var Fw = qrot(s.q, a.F);
      var wdot = m3v(mp.Iinv, sub(a.M, cross(s.w, m3v(mp.I, s.w))));
      var qd = qmul(s.q, [0, s.w[0], s.w[1], s.w[2]]);
      return { p: s.v, v: [Fw[0] / m, Fw[1] / m, Fw[2] / m + G], q: [qd[0] * 0.5, qd[1] * 0.5, qd[2] * 0.5, qd[3] * 0.5], w: wdot };
    }
    function adv(s0, k, h) {
      return { p: add(s0.p, mul(k.p, h)), v: add(s0.v, mul(k.v, h)), q: [s0.q[0] + k.q[0] * h, s0.q[1] + k.q[1] * h, s0.q[2] + k.q[2] * h, s0.q[3] + k.q[3] * h], w: add(s0.w, mul(k.w, h)) };
    }
    function step(s) {
      var k1 = deriv(s), k2 = deriv(adv(s, k1, dt / 2)), k3 = deriv(adv(s, k2, dt / 2)), k4 = deriv(adv(s, k3, dt));

  /* ---------------- canvas helpers ---------------- */
  function prepCanvas(cv) {
    var r = cv.getBoundingClientRect();
    var w = Math.max(10, Math.floor(r.width)), h = Math.max(10, Math.floor(r.height));
    if (cv.width !== Math.floor(w * DPR) || cv.height !== Math.floor(h * DPR)) { cv.width = Math.floor(w * DPR); cv.height = Math.floor(h * DPR); }
    var ctx = cv.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    return { ctx: ctx, w: w, h: h };
  }
  /* vector-display line: a wide dim stroke under a thin bright stroke */
  function vline(ctx, pts, color, width, closed, glow) {
    if (pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (closed) ctx.closePath();
    if (glow !== false) {
      ctx.globalAlpha = 0.22; ctx.strokeStyle = color; ctx.lineWidth = (width || 1.3) + 3; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = color; ctx.lineWidth = width || 1.3; ctx.stroke();
  }
  function text(ctx, s, x, y, color, align, size) {
    ctx.font = (size || 11) + 'px Consolas, "Lucida Console", "Courier New", monospace';
    ctx.fillStyle = color || C.dim; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
  }
  function cgSymbol(ctx, x, y, r) {
    ctx.strokeStyle = C.white; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.stroke();
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, -Math.PI / 2, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, Math.PI / 2, Math.PI); ctx.closePath(); ctx.fill();
  }
  function npSymbol(ctx, x, y, r) {
    ctx.strokeStyle = C.amber; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.stroke();
    ctx.fillStyle = C.amber; ctx.beginPath(); ctx.arc(x, y, 2, 0, 2 * Math.PI); ctx.fill();
  }

  /* =====================================================================
     DESIGN SCREEN: three orthographic views at one common scale
     ===================================================================== */
  var DVIEWS = [
    { id: 'dTop', proj: function (p) { return [p[0], -p[1]]; } },
    { id: 'dRear', proj: function (p) { return [p[1], -p[2]]; } },
    { id: 'dSide', proj: function (p) { return [p[0], -p[2]]; } }
  ];
  function drawDesign() {
    if (state.tab !== 'design') return;
    var an = state.an, geo = an.geo, d = state.design;
    var cg = an.mp.cg, np = [an.npX, 0, 0];
    var sel = PART_KINDS[state.part] || [];
    var allPts = [];
    geo.lines.forEach(function (ln) { allPts = allPts.concat(ln.pts); });
    allPts.push(cg, np);
    var preps = [], scale = Infinity, pad = 26;
    DVIEWS.forEach(function (v) {
      var pr = prepCanvas($(v.id).querySelector('canvas'));
      var mn = [Infinity, Infinity], mx = [-Infinity, -Infinity];
      allPts.forEach(function (p) { var q = v.proj(p); mn[0] = Math.min(mn[0], q[0]); mn[1] = Math.min(mn[1], q[1]); mx[0] = Math.max(mx[0], q[0]); mx[1] = Math.max(mx[1], q[1]); });
      var du = Math.max(mx[0] - mn[0], 50), dv = Math.max(mx[1] - mn[1], 50);
      scale = Math.min(scale, (pr.w - 2 * pad) / du, (pr.h - 2 * pad - 14) / dv);
      preps.push({ v: v, pr: pr, mn: mn, mx: mx });
    });
    var gridMM = scale * 10 > 6 ? 10 : 50;
    preps.forEach(function (o) {
      var ctx = o.pr.ctx, w = o.pr.w, h = o.pr.h;
      var cu = (o.mn[0] + o.mx[0]) / 2, cv = (o.mn[1] + o.mx[1]) / 2;
      function S(p) { var q = o.v.proj(p); return [w / 2 + (q[0] - cu) * scale, h / 2 + 7 + (q[1] - cv) * scale]; }
      var o0 = S([0, 0, 0]), step = gridMM * scale;
      for (var gx = o0[0] % step; gx < w; gx += step) { var mj = Math.round((gx - o0[0]) / step) % 5 === 0; ctx.strokeStyle = mj ? C.faint : C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
      for (var gy = o0[1] % step; gy < h; gy += step) { var mj2 = Math.round((gy - o0[1]) / step) % 5 === 0; ctx.strokeStyle = mj2 ? C.faint : C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }
      geo.lines.forEach(function (ln) {
        if (ln.sideOnly && o.v.id !== 'dSide') return;
        var on = sel.indexOf(ln.kind) >= 0;
        vline(ctx, ln.pts.map(S), on ? C.white : C.line, on ? 1.8 : 1.3, !!ln.closed);
      });
      if (o.v.id !== 'dRear') geo.ballastPts.forEach(function (b) {
        var c = S(b.p), on = state.part === 'ballast';
        ctx.strokeStyle = on ? C.white : C.cyan; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(c[0], c[1], 4, 0, 2 * Math.PI); ctx.stroke();
        if (o.v.id === 'dSide') text(ctx, b.count + ' × ' + b.name, c[0], c[1] + 12, C.cyan, 'center', 10);
      });
      var cgS = S(cg);
      if (o.v.id === 'dRear') cgSymbol(ctx, cgS[0], cgS[1], 6);
      else {
        var npS = S([np[0], 0, cg[2]]);
        npSymbol(ctx, npS[0], npS[1], 7);
        cgSymbol(ctx, cgS[0], cgS[1], 6);
        text(ctx, 'CG', cgS[0], cgS[1] - 14, C.white, 'center', 11);
        text(ctx, 'NP', npS[0], npS[1] + 15, C.amber, 'center', 11);
      }
      if (o.v.id === 'dTop') {
        text(ctx, 'RIGHT', S([d.wing.x + d.wing.sweep + d.wing.tipChord / 2, d.wing.semiSpan, 0])[0], S([0, d.wing.semiSpan, 0])[1] - 10, C.dim, 'center', 10);
        text(ctx, 'NOSE', o0[0] - 6, o0[1], C.dim, 'right', 10);
      }
      if (o.v.id === 'dSide') {
        var yR = h - 12, L = d.fuselage.length;
        var a0 = S([0, 0, 0])[0], a1 = S([L, 0, 0])[0];
        ctx.strokeStyle = C.dim; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a0, yR); ctx.lineTo(a1, yR); ctx.stroke();
        var tick = L > 500 ? 50 : 10, big = L > 500 ? 100 : 50;
        for (var mm = 0; mm <= L + 0.1; mm += tick) {
          var xx = S([mm, 0, 0])[0], bg = mm % big === 0;
          ctx.beginPath(); ctx.moveTo(xx, yR); ctx.lineTo(xx, yR - (bg ? 6 : 3)); ctx.stroke();
          if (bg) text(ctx, String(mm), xx, yR - 10, C.dim, 'center', 9);
        }
        text(ctx, 'mm from nose', a1 + 6, yR - 4, C.dim, 'left', 9);
      }
      if (o.v.id === 'dRear') text(ctx, 'RIGHT →', w - 8, h - 12, C.dim, 'right', 10);
    });
    $('dTop').querySelector('.vlabel').textContent = 'TOP VIEW   ·   GRID SQUARE = ' + gridMM + ' mm';
  }

    var h = '<h2>ANALYSIS</h2><div class="ro">';

      an.warnings.forEach(function (w) {
        var cls = w.level === 'bad' ? 'badc' : (w.level === 'warn' ? 'warn' : 'info');
        h += '<li class="' + cls + '">' + (w.level === 'bad' ? '✖ ' : (w.level === 'warn' ? '▲ ' : '● ')) + esc(w.text) + '</li>';
      });
      h += '</ul>';
    } else h += '<div class="good">● All checks passed.</div>';
    $('readouts').innerHTML = h;
  }

  /* =====================================================================
     FLIGHT SCREEN
     ===================================================================== */
  var FVIEWS = [
    { id: 'vSide', name: 'SIDE VIEW', proj: function (x, y, h) { return [x, -h]; } },
    { id: 'vTop', name: 'TOP VIEW', proj: function (x, y, h) { return [x, y]; } },
    { id: 'vRear', name: 'REAR VIEW', proj: function (x, y, h) { return [y, -h]; } }
  ];
  var fcache = null;   // static backgrounds for replay

  function launch() {
    var b = $('btnLaunch');
    if (b) { b.disabled = true; b.textContent = 'CALCULATING…'; }
    stopReplay();
    setTimeout(function () {
      try { state.sim = P.simulate(state.design); }
      catch (e) { state.sim = null; toast('The flight could not be calculated: ' + e.message); }
      if (b) { b.disabled = false; b.textContent = 'LAUNCH'; }
      renderAside();
      renderResults();
      if (state.sim) startReplay();
    }, 30);
  }

  function planeOutlineWorld(rec, scale) {
    var geo = state.an.geo, cgB = state.an.mp.cgB;
    return geo.lines.map(function (ln) {
      return {
        kind: ln.kind, closed: !!ln.closed,
        pts: ln.pts.map(function (p) {
          var b = P.d2b(p); b = [(b[0] - cgB[0]) * scale, (b[1] - cgB[1]) * scale, (b[2] - cgB[2]) * scale];
          var wv = P.qrot(rec.q, b);
          return [rec.x + wv[0], rec.y + wv[1], rec.h - wv[2]];
        })
      };
    });
  }

  function buildFlightCache() {
    var sim = state.sim;
    var recs = sim ? sim.records : [{ x: 0, y: 0, h: state.design.launch.height }];
    var maxX = 1, minX = 0, maxH = state.design.launch.height + 0.3, maxY = 0.5;
    recs.forEach(function (r) { maxX = Math.max(maxX, r.x); minX = Math.min(minX, r.x); maxH = Math.max(maxH, r.h); maxY = Math.max(maxY, Math.abs(r.y)); });
    var margin = 0.45 * state.planeScale + 0.3;
    var box = { x0: minX - margin, x1: maxX + margin, y0: -maxY - margin, y1: maxY + margin, h0: 0, h1: maxH + margin };
    fcache = { views: [] };
    FVIEWS.forEach(function (v) {
      var cv = $(v.id).querySelector('canvas');
      var pr = prepCanvas(cv);
      var u0, u1, w0, w1;  // screen-axis ranges in meters
      if (v.id === 'vSide') { u0 = box.x0; u1 = box.x1; w0 = -box.h1; w1 = -box.h0; }
      else if (v.id === 'vTop') { u0 = box.x0; u1 = box.x1; w0 = box.y0; w1 = box.y1; }
      else { u0 = box.y0; u1 = box.y1; w0 = -box.h1; w1 = -box.h0; }
      var pad = 22;
      var s = Math.min((pr.w - 2 * pad) / (u1 - u0), (pr.h - 2 * pad) / (w1 - w0));
      var ox = pr.w / 2 - (u0 + u1) / 2 * s, oy = pr.h / 2 - (w0 + w1) / 2 * s;
      function S(x, y, h) { var q = v.proj(x, y, h); return [ox + q[0] * s, oy + q[1] * s]; }
      var ctx = pr.ctx;
      // 1 m grid
      var gm = s >= 30 ? 1 : (s >= 6 ? 5 : 10);
      ctx.lineWidth = 1;
      var uStart = Math.floor(u0 / gm) * gm, wStart = Math.floor(w0 / gm) * gm;
      for (var u = uStart; u <= u1 + 1e-6; u += gm) { var X = ox + u * s; ctx.strokeStyle = Math.abs(u) < 1e-6 ? C.faint : C.grid; ctx.beginPath(); ctx.moveTo(X, 0); ctx.lineTo(X, pr.h); ctx.stroke(); text(ctx, String(Math.round(u)), X + 2, pr.h - 8, C.dim, 'left', 9); }
      for (var ww = wStart; ww <= w1 + 1e-6; ww += gm) { var Y = oy + ww * s; ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(0, Y); ctx.lineTo(pr.w, Y); ctx.stroke(); if (Math.abs(ww) > 1e-6) text(ctx, String(Math.round(Math.abs(ww))), 3, Y - 6, C.dim, 'left', 9); }
      // ground line
      if (v.id !== 'vTop') { var g = S(0, 0, 0)[1]; vline(ctx, [[0, g], [pr.w, g]], C.dim, 1.2, false, false); text(ctx, 'GROUND', pr.w - 6, g + 9, C.dim, 'right', 9); }
      else { var c0 = S(0, 0, 0); ctx.setLineDash([4, 6]); vline(ctx, [[0, c0[1]], [pr.w, c0[1]]], C.faint, 1, false, false); ctx.setLineDash([]); text(ctx, 'LAUNCH LINE', pr.w - 6, c0[1] - 8, C.dim, 'right', 9); }
      text(ctx, 'grid = ' + gm + ' m', pr.w - 6, 10, C.dim, 'right', 9);
      // launch point
      var lp = S(0, 0, state.design.launch.height);
      ctx.strokeStyle = C.cyan; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(lp[0] - 5, lp[1]); ctx.lineTo(lp[0] + 5, lp[1]); ctx.moveTo(lp[0], lp[1] - 5); ctx.lineTo(lp[0], lp[1] + 5); ctx.stroke();
      // full path, dim
      if (sim) {
        vline(ctx, recs.map(function (r) { return S(r.x, r.y, r.h); }), C.faint, 1.2, false, false);
        var last = recs[recs.length - 1], lpnt = S(last.x, last.y, Math.max(last.h, 0));
        ctx.strokeStyle = C.amber; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(lpnt[0] - 5, lpnt[1] - 5); ctx.lineTo(lpnt[0] + 5, lpnt[1] + 5); ctx.moveTo(lpnt[0] + 5, lpnt[1] - 5); ctx.lineTo(lpnt[0] - 5, lpnt[1] + 5); ctx.stroke();
      }
      var bg = document.createElement('canvas');
      bg.width = cv.width; bg.height = cv.height;
      bg.getContext('2d').drawImage(cv, 0, 0);
      fcache.views.push({ v: v, cv: cv, bg: bg, S: S, w: pr.w, h: pr.h });
    });
  }

  function drawFlightFrame(idx) {
    if (state.tab !== 'flight' || !state.an) return;
    if (!fcache) buildFlightCache();
    var sim = state.sim;
    var recs = sim ? sim.records : null;
    if (recs && (idx === undefined || !recs[idx])) idx = recs.length - 1;
    var rec = recs ? recs[idx] : { x: 0, y: 0, h: state.design.launch.height, q: [Math.cos(state.design.launch.angle * DEG / 2), 0, Math.sin(state.design.launch.angle * DEG / 2), 0], t: 0, speed: state.design.launch.speed, alpha: 0 };
    var outline = planeOutlineWorld(rec, state.planeScale);
    fcache.views.forEach(function (fv) {
      var ctx = fv.cv.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(fv.bg, 0, 0);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (recs) {
        var trace = [];
        for (var i = 0; i <= idx; i++) trace.push(fv.S(recs[i].x, recs[i].y, recs[i].h));
        vline(ctx, trace, C.cyan, 1.3, false);
      }
      outline.forEach(function (ln) { vline(ctx, ln.pts.map(function (p) { return fv.S(p[0], p[1], p[2]); }), C.line, 1.3, ln.closed); });
      if (fv.v.id === 'vSide') {
        var s = 't ' + fmt(rec.t, 2) + ' s   height ' + fmt(rec.h, 2) + ' m   speed ' + fmt(rec.speed, 2) + ' m/s   angle of attack ' + fmt(rec.alpha, 1) + '°';
        text(ctx, s, 110, 9, C.white, 'left', 11);
      }
    });
    drawChart(idx);
  }

  function startReplay() {
    stopReplay();
    fcache = null;
    buildFlightCache();
    var simRef = state.sim, recs = simRef.records, T = recs[recs.length - 1].t;
    var start = performance.now();
    state.play = { raf: 0 };
    function frame(now) {
      if (state.sim !== simRef || state.tab !== 'flight') { state.play = null; return; }
      var t = (now - start) / 1000 * state.playSpeed;
      var idx = recs.length - 1;
      if (t < T) { idx = Math.min(recs.length - 1, Math.round(t * 60)); while (idx > 0 && recs[idx].t > t) idx--; }
      drawFlightFrame(idx);
      if (t < T && state.play) state.play.raf = requestAnimationFrame(frame);
      else state.play = null;
    }
    state.play.raf = requestAnimationFrame(frame);
  }
  function stopReplay() { if (state.play) { cancelAnimationFrame(state.play.raf); state.play = null; } }

  function renderResults() {
    var r = $('results'), sim = state.sim, an = state.an;
    if (!sim) {
      r.innerHTML = '<h2>FLIGHT RESULTS</h2><div class="note">Set the launch conditions on the left and press <b>LAUNCH</b>.</div>' +
        '<h2 style="margin-top:10px">DESIGN SUMMARY</h2><div class="ro">' +
        '<span class="k">Mass</span><span class="v">' + fmt(an.mp.mass * 1000, 2) + ' g</span>' +
        '<span class="k">Static margin</span><span class="v">' + fmt(an.sm * 100, 1) + ' %</span>' +
        '<span class="k">Steady glide speed</span><span class="v">' + (an.trimSpeed ? fmt(an.trimSpeed, 2) + ' m/s' : '—') + '</span>' +
        '<span class="k">Glide ratio</span><span class="v">' + (an.glideRatio ? fmt(an.glideRatio, 1) + ' : 1' : '—') + '</span></div>' +
        (an.trimSpeed ? '<div class="note" style="margin-top:6px">Tip: a launch speed close to the steady glide speed gives the smoothest glide. A faster throw makes the glider climb first.</div>' : '');
      fcache = null;
      return;
    }
    var side = sim.lateral < -0.05 ? ' left' : (sim.lateral > 0.05 ? ' right' : '');
    var h = '<h2>FLIGHT RESULTS</h2><div class="ro">' +
      '<span class="k">Time aloft</span><span class="v">' + fmt(sim.timeAloft, 2) + ' s</span>' +
      '<span class="k">Distance</span><span class="v">' + fmt(sim.distance, 2) + ' m</span>' +
      '<span class="k">&nbsp;&nbsp;downrange</span><span class="v">' + fmt(sim.downrange, 2) + ' m</span>' +
      '<span class="k">&nbsp;&nbsp;sideways</span><span class="v">' + fmt(Math.abs(sim.lateral), 2) + ' m' + side + '</span>' +
      '<span class="k">Max height</span><span class="v">' + fmt(sim.maxHeight, 2) + ' m</span>' +
      '<span class="k">Max speed</span><span class="v">' + fmt(sim.maxSpeed, 2) + ' m/s</span>' +
      '<span class="k">Landing speed</span><span class="v">' + fmt(sim.landingSpeed, 2) + ' m/s</span>' +
      '<span class="k">Landing angle</span><span class="v">' + fmt(Math.abs(sim.landingAngle), 0) + '° down</span>' +
      '</div><h2 style="margin-top:8px">HOW IT FLEW</h2>';
    sim.behavior.text.forEach(function (t) { h += '<div class="' + (sim.behavior.key === 'glide' ? 'good' : 'warn') + '" style="margin:3px 0;line-height:1.3">' + esc(t) + '</div>'; });
    if (sim.ended === 'time') h += '<div class="info">The calculation stopped at 60 s of flight.</div>';
    if (sim.ended === 'range') h += '<div class="info">The calculation stopped because the glider left the 1000 m test area.</div>';
    h += '<canvas id="chart"></canvas><div class="legend"><span class="good">— height (m)</span><span style="color:#46d9ff">— speed (m/s)</span></div>';
    h += '<div class="note" style="margin-top:6px">The simulator predicts trends. Real foam board flexes, builds are never perfect, and every throw is different, so measured flights will vary. Compare them on the TEST FLIGHTS screen.</div>';
    r.innerHTML = h;
  }

  function drawChart(idx) {
    var cv = $('chart'); if (!cv || !state.sim) return;
    var pr = prepCanvas(cv), ctx = pr.ctx, w = pr.w, hh = pr.h;
    var recs = state.sim.records, T = Math.max(recs[recs.length - 1].t, 0.1);
    var maxH = 0.1, maxV = 0.1;
    recs.forEach(function (r) { maxH = Math.max(maxH, r.h); maxV = Math.max(maxV, r.speed); });
    var l = 26, rr = 26, t0 = 6, b = 16;
    function X(t) { return l + (w - l - rr) * t / T; }
    ctx.strokeStyle = C.faint; ctx.lineWidth = 1; ctx.strokeRect(l, t0, w - l - rr, hh - t0 - b);
    vline(ctx, recs.map(function (r) { return [X(r.t), hh - b - (hh - t0 - b) * r.h / maxH]; }), C.line, 1.2, false, false);
    vline(ctx, recs.map(function (r) { return [X(r.t), hh - b - (hh - t0 - b) * r.speed / maxV]; }), C.cyan, 1.2, false, false);
    text(ctx, fmt(maxH, 1), l - 3, t0 + 4, C.line, 'right', 9);
    text(ctx, fmt(maxV, 1), w - rr + 3, t0 + 4, C.cyan, 'left', 9);
    text(ctx, '0', l, hh - 7, C.dim, 'center', 9);
    text(ctx, fmt(T, 1) + ' s', w - rr, hh - 7, C.dim, 'center', 9);
    if (idx !== undefined && recs[idx]) { var xx = X(recs[idx].t); ctx.strokeStyle = C.white; ctx.beginPath(); ctx.moveTo(xx, t0); ctx.lineTo(xx, hh - b); ctx.stroke(); }
  }

  /* =====================================================================
     CUTTING TEMPLATE: parts packed on foam board sheets, printed full size
     across US Letter pages that overlap and tape together.
     ===================================================================== */
  var PAGE = { W: 215.9, H: 279.4, M: 8, OV: 12 };
  PAGE.PW = PAGE.W - 2 * PAGE.M; PAGE.PH = PAGE.H - 2 * PAGE.M;
  PAGE.SX = PAGE.PW - PAGE.OV; PAGE.SY = PAGE.PH - PAGE.OV;
  var ROWS = 'ABCDEFGHIJ';
  var LSTYLE = {
    cut: 'stroke="#000" stroke-width="0.45" fill="none"',
    score: 'stroke="#000" stroke-width="0.35" stroke-dasharray="4 1.5" fill="none"',
    light: 'stroke="#555" stroke-width="0.25" stroke-dasharray="1 1.5" fill="none"',
    fold: 'stroke="#000" stroke-width="0.35" stroke-dasharray="6 2 1 2" fill="none"',
    mark: 'stroke="#777" stroke-width="0.3" stroke-dasharray="0.6 1.2" fill="none"',
    balance: 'stroke="#000" stroke-width="0.6" fill="none"'
  };

  function tilesForSheet(sheet, lay) {
    var cols = Math.max(1, Math.ceil((lay.sheetW - PAGE.OV) / PAGE.SX));
    var rows = Math.max(1, Math.ceil((lay.sheetH - PAGE.OV) / PAGE.SY));
    var tiles = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var x0 = c * PAGE.SX, y0 = r * PAGE.SY;
      var used = sheet.items.some(function (it) { return it.x < x0 + PAGE.PW && it.x + it.w > x0 && it.y < y0 + PAGE.PH && it.y + it.h > y0; });
      tiles.push({ r: r, c: c, x0: x0, y0: y0, id: ROWS[r] + (c + 1), used: used });
    }
    return { tiles: tiles, rows: rows, cols: cols };
  }

  function polyStr(pts) { return pts.map(function (q) { return q[0].toFixed(2) + ',' + q[1].toFixed(2); }).join(' '); }
  function svgText(x, y, s, size, rot, color, anchor, weight) {
    return '<text x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" font-size="' + size + '" fill="' + (color || '#000') + '" text-anchor="' + (anchor || 'middle') + '" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif"' + (weight ? ' font-weight="' + weight + '"' : '') + (rot ? ' transform="rotate(' + rot + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ')"' : '') + '>' + esc(s) + '</text>';
  }

  /* everything on one sheet, in sheet millimeters */
  function sheetContent(sheet, lay, opts) {
    opts = opts || {};
    var s = [];
    if (opts.grid) {
      for (var gx = 0; gx <= lay.sheetW + 0.1; gx += 50) s.push('<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + lay.sheetH + '" stroke="' + (gx % 100 === 0 ? '#c8c8c8' : '#e2e2e2') + '" stroke-width="0.25"/>');
      for (var gy = 0; gy <= lay.sheetH + 0.1; gy += 50) s.push('<line x1="0" y1="' + gy + '" x2="' + lay.sheetW + '" y2="' + gy + '" stroke="' + (gy % 100 === 0 ? '#c8c8c8' : '#e2e2e2') + '" stroke-width="0.25"/>');
      // grid coordinates every 100 mm help line the pages up
      for (var ax = 100; ax < lay.sheetW; ax += 100) for (var ay = 100; ay < lay.sheetH; ay += 100) s.push(svgText(ax + 1.5, ay - 2, (ax / 100) + '·' + (ay / 100), 2.4, 0, '#aaa', 'start'));
    }
    s.push('<rect x="0" y="0" width="' + lay.sheetW + '" height="' + lay.sheetH + '" fill="none" stroke="#999" stroke-width="0.4" stroke-dasharray="3 3"/>');
    sheet.items.forEach(function (it) {
      var p = it.part, rot = it.rot ? 90 : 0;
      s.push('<polygon points="' + polyStr(p.outline.map(it.map)) + '" ' + LSTYLE.cut + '/>');
      if (opts.simple) { var cc = it.map([p.w / 2, p.h / 2]); s.push(svgText(cc[0], cc[1], p.name + (p.qty > 1 ? ' ' + it.copy : ''), opts.labelSize || 14, 0, '#333')); return; }
      p.lines.forEach(function (l) {
        var pts = l.pts.map(it.map);
        s.push('<polyline points="' + polyStr(pts) + '" ' + (LSTYLE[l.type] || LSTYLE.mark) + '/>');
        if (l.type === 'balance') {
          var b = pts[0]; s.push('<circle cx="' + b[0].toFixed(2) + '" cy="' + b[1].toFixed(2) + '" r="1.6" fill="#000"/>');
        }
        if (l.label) {
          var a = pts[0], z = pts[pts.length - 1];
          var mid = pts.length > 2 ? pts[Math.floor(pts.length / 2)] : [(a[0] + z[0]) / 2, (a[1] + z[1]) / 2];
          var ang = Math.atan2(z[1] - a[1], z[0] - a[0]) * 180 / Math.PI;
          if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
          var len = Math.hypot(z[0] - a[0], z[1] - a[1]);
          if (len < 12) ang = 0;
          var nx = -Math.sin(ang * Math.PI / 180) * 2.4, ny = Math.cos(ang * Math.PI / 180) * 2.4;
          s.push(svgText(mid[0] + nx, mid[1] + ny, l.label, 2.4, ang, '#000'));
        }
      });
      p.labels.forEach(function (lb) {
        var q = it.map([lb.u, lb.v]);
        s.push(svgText(q[0], q[1], lb.text, lb.size || 4, ((lb.rot || 0) + rot) % 360, '#444'));
      });
    });
    return s.join('');
  }

  function renderTemplatePanel(a) {
    var an = state.an, lay = an.layout;
    a.appendChild(el('h2', null, 'PRINTING'));
    var pages = 0;
    lay.sheets.forEach(function (sh) { pages += tilesForSheet(sh, lay).tiles.filter(function (t) { return t.used; }).length; });
    a.appendChild(el('div', { class: 'ro' },
      '<span class="k">Foam board sheets</span><span class="v">' + lay.sheets.length + '</span>' +
      '<span class="k">Pattern pages</span><span class="v">' + pages + '</span>' +
      '<span class="k">Instruction pages</span><span class="v">2</span>' +
      '<span class="k">Paper</span><span class="v">US Letter</span>'));
    if (lay.unplaced.length) a.appendChild(el('div', { class: 'badc', style: 'margin:6px 0' }, '✖ Too large for one sheet: ' + esc(lay.unplaced.join(', ')) + '. These parts are left off the template.'));
    var b = el('button', { class: 'primary bigbtn' }, 'PRINT TEMPLATE');
    b.addEventListener('click', printTemplate);
    a.appendChild(b);
    a.appendChild(el('div', { class: 'note' }, 'In the print window, set the scale to <b>Actual size</b> or <b>100%</b> (not "Fit to page"). Measure the 100 mm line on page 1 to check.'));
    a.appendChild(el('h2', { style: 'margin-top:10px' }, 'FOAM BOARD'));
    var boardPart = PARTS.filter(function (x) { return x.id === 'board'; })[0];
    boardPart.fields.forEach(function (f) { a.appendChild(fieldRow(f, function () { changed(); })); });
  }

  function legendHTML() {
    function sw(style) { return '<svg width="14mm" height="3mm" viewBox="0 0 14 3"><line x1="0" y1="1.5" x2="14" y2="1.5" ' + style.replace('fill="none"', '') + '/></svg>'; }
    return '<div class="legend2">' +
      '<span>' + sw(LSTYLE.cut) + ' cut through</span>' +
      '<span>' + sw(LSTYLE.score) + ' hinge score: cut the top paper and foam, not the bottom paper</span>' +
      '<span>' + sw(LSTYLE.light) + ' light score: top paper only</span>' +
      '<span>' + sw(LSTYLE.fold) + ' leading-edge fold</span>' +
      '<span>' + sw(LSTYLE.mark) + ' pencil guide for gluing</span></div>';
  }

  function mapSVG(sheet, idx, lay, widthMM, forPreview) {
    var t = tilesForSheet(sheet, lay);
    var s = '<svg xmlns="http://www.w3.org/2000/svg" ' + (forPreview ? 'width="100%"' : 'width="' + widthMM + 'mm"') + ' viewBox="-4 -14 ' + (lay.sheetW + 8) + ' ' + (lay.sheetH + 18) + '">';
    s += '<rect x="-4" y="-14" width="' + (lay.sheetW + 8) + '" height="' + (lay.sheetH + 18) + '" fill="#fff"/>';
    s += svgText(0, -7, 'SHEET ' + (idx + 1) + ' of ' + lay.sheets.length + ' · ' + Math.round(lay.sheetW) + ' × ' + Math.round(lay.sheetH) + ' mm foam board', 12, 0, '#000', 'start', 'bold');
    s += sheetContent(sheet, lay, { simple: true, labelSize: 16 });
    t.tiles.forEach(function (tl) {
      if (!tl.used) return;
      s += '<rect x="' + tl.x0 + '" y="' + tl.y0 + '" width="' + PAGE.PW + '" height="' + PAGE.PH + '" fill="none" stroke="#2a6" stroke-width="1.2" stroke-dasharray="6 4"/>';
      s += svgText(tl.x0 + 14, tl.y0 + 14, tl.id, 13, 0, '#2a6', 'middle', 'bold');
    });
    s += '</svg>';
    return s;
  }

  function buildSteps() {
    var d = state.design, an = state.an, g = an.geo, steps = [];
    steps.push('Print every page at <b>Actual size (100%)</b>. Measure the 100 mm line on this page.');
    steps.push('For each sheet, lay the pages out as shown on the map. Overlap neighboring pages by about 12 mm so the gray grid lines and grid numbers match, then tape the pages together.');
    steps.push('Tape the pattern onto the foam board. With a sharp hobby knife and a metal ruler, cut through the paper and board along every <b>solid line</b>. Cut on a cutting mat, keep your fingers behind the blade, and make several light passes instead of one hard pass.');
    steps.push('<b>Hinge scores</b> (elevator and rudder): cut through the top paper and the foam but <b>not the bottom paper</b>, then bend the surface gently so it hinges on the bottom paper.');
    if (g.folded) {
      steps.push('<b>Folded airfoil wing:</b> on each wing piece, cut through the top paper on both <b>leading-edge fold</b> lines and peel out the strip of foam between them, leaving the bottom paper. Make the <b>light scores</b> (top paper only) on the top-surface section.');
      steps.push('Hot-glue the <b>spar</b> on its pencil line, standing on edge (' + fmt(g.sparH, 1) + ' mm tall). Fold the top surface back over the spar so it curves, and glue it to the spar and to the back edge of the wing. The finished airfoil is about ' + fmt(g.T, 0) + ' mm thick.');
    }
    if (Math.abs(d.wing.dihedral) > 0.1) steps.push('<b>Dihedral:</b> bevel the root edge of each wing half slightly, then hot-glue the halves together with each tip raised ' + d.wing.dihedral + '° (use the dihedral gauge). Hold the joint until the glue sets.');
    else if (an.layout.parts.some(function (p) { return p.id === 'wingR'; })) steps.push('Hot-glue the two wing halves together flat.');
    if (d.fuselage.layers > 1) steps.push('Glue the ' + d.fuselage.layers + ' fuselage layers together, edges matched.');
    steps.push('Hot-glue the wing on the top edge of the fuselage at the <b>WING</b> mark' + (Math.abs(d.wing.incidence) > 0.05 ? ' (the seat is already cut at ' + d.wing.incidence + '°)' : '') + '. Check from the front that the wing is square to the fuselage.');
    steps.push('Glue the stabilizer on the fuselage at the <b>STABILIZER</b> mark, square to the fuselage. Glue the fin upright on the stabilizer center line, with its front edge ' + d.vstab.x + ' mm from the nose.');
    if (d.canard.enabled) steps.push('Glue the <b>canard</b> on the fuselage at the <b>CANARD</b> mark, square to the fuselage' + (Math.abs(d.canard.incidence) > 0.05 ? ' (the seat is already cut at ' + d.canard.incidence + '°, front edge up)' : '') + '. Its front edge is ' + d.canard.x + ' mm from the nose. Check from the front that it is level with the wing.');
    if (d.winglets.enabled) steps.push('Glue one <b>winglet</b> on each wing tip, standing ' + (d.winglets.cant > 0.05 ? 'leaning outward ' + d.winglets.cant + '° from vertical (winglet gauge)' : 'straight up') + ', with its back edge level with the back edge of the wing tip. Make sure both winglets match.');
    if (d.hstab.elevChord > 0) steps.push(Math.abs(d.hstab.elevUp) > 0.05 ? 'Bend the elevator ' + (d.hstab.elevUp >= 0 ? 'up ' : 'down ') + Math.abs(d.hstab.elevUp) + '° (elevator gauge).' : 'Leave the elevator straight, in line with the stabilizer.');
    if (d.vstab.rudderChord > 0 && Math.abs(d.vstab.rudderRight) > 0.05) steps.push('Bend the rudder ' + Math.abs(d.vstab.rudderRight) + '° to the ' + (d.vstab.rudderRight > 0 ? 'right' : 'left') + ' (rudder gauge).');
    var bl = d.ballast.filter(function (b) { return b.count * b.mass > 0; });
    if (bl.length) steps.push('Attach the ballast to the sides of the nose at the BALLAST marks: ' + bl.map(function (b) { return b.count + ' × ' + esc(b.name) + ' at ' + b.x + ' mm'; }).join('; ') + '.');
    if (d.tape.length > 0) steps.push('Apply about ' + d.tape.length + ' cm of tape (leading edges and nose).');
    steps.push('<b>Balance check:</b> hold one fingertip under each wing, next to the fuselage, at the <b>BALANCE POINT</b> distance (' + fmt(an.mp.cg[0], 0) + ' mm from the nose; it is marked on the fuselage). The glider should hang level. If the nose drops, remove a little ballast; if the tail drops, add ballast.');
    steps.push('Test-glide with a gentle, level toss over grass or a gym floor. Record each flight on the TEST FLIGHTS screen.');
    return steps;
  }

  function gaugeSVG(deg, title, sub, Lmm) {
    var L = Lmm || 45, a = Math.abs(deg) * DEG, w = L + 15, h = Math.max(16, L * Math.sin(a) + 12);
    var x0 = 6, y0 = h - 6, x1 = x0 + L * Math.cos(a), y1 = y0 - L * Math.sin(a);
    var arc = 'M ' + (x0 + 14) + ' ' + y0 + ' A 14 14 0 0 0 ' + (x0 + 14 * Math.cos(a)).toFixed(2) + ' ' + (y0 - 14 * Math.sin(a)).toFixed(2);
    return '<div class="gauge"><svg xmlns="http://www.w3.org/2000/svg" width="' + w + 'mm" height="' + h.toFixed(1) + 'mm" viewBox="0 0 ' + w + ' ' + h.toFixed(1) + '">' +
      '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + (x0 + L + 6) + '" y2="' + y0 + '" stroke="#000" stroke-width="0.4"/>' +
      '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x1.toFixed(2) + '" y2="' + y1.toFixed(2) + '" stroke="#000" stroke-width="0.4"/>' +
      '<path d="' + arc + '" stroke="#000" stroke-width="0.3" fill="none"/>' +
      '<text x="' + (x0 + 18) + '" y="' + (y0 - 3) + '" font-size="3" font-family="Arial">' + Math.abs(deg) + '°</text>' +
      '</svg><div class="gt">' + esc(title) + '</div><div class="gs">' + esc(sub) + '</div></div>';
  }

    '.gauges{display:flex;flex-wrap:wrap;gap:4mm;margin-top:2mm}' +

  function coverPages(forPrint) {
    var d = state.design, an = state.an, lay = an.layout;
    var size = forPrint ? 'width:' + PAGE.W + 'mm;height:' + (PAGE.H - 1) + 'mm;' : 'width:' + PAGE.W + 'mm;height:' + PAGE.H + 'mm;';
    var pageList = lay.sheets.map(function (sh, i) {
      return 'Sheet ' + (i + 1) + ': ' + tilesForSheet(sh, lay).tiles.filter(function (t) { return t.used; }).map(function (t) { return t.id; }).join(', ');
    }).join(' &nbsp;·&nbsp; ');
    // size the sheet maps so they all fit on the cover page
    var nS = Math.max(1, lay.sheets.length), aspect = (lay.sheetH + 18) / (lay.sheetW + 8);
    var mapW = Math.min(186, (175 - 3 * nS) / (aspect * nS));
    var maps = lay.sheets.map(function (sh, i) { return mapSVG(sh, i, lay, mapW, false); }).join('');
    var p1 = '<div class="cv" style="' + size + '"><div class="cvin">' +
      '<div class="cvt">FOAM BOARD GLIDER · ' + esc(d.name || 'Untitled') + '</div>' +
      '<div class="cvs">Designer: ' + esc(d.designer || '—') + ' &nbsp;·&nbsp; Printed ' + today() + ' &nbsp;·&nbsp; ' + lay.sheets.length + ' sheet' + (lay.sheets.length > 1 ? 's' : '') + ' of ' + Math.round(lay.sheetW) + ' × ' + Math.round(lay.sheetH) + ' × ' + d.board.thickness + ' mm foam board</div>' +
      '<div class="cvs">Predicted mass ' + fmt(an.mp.mass * 1000, 0) + ' g &nbsp;·&nbsp; Balance point ' + fmt(an.mp.cg[0], 0) + ' mm from the nose &nbsp;·&nbsp; Static margin ' + fmt(an.sm * 100, 1) + ' %' + (an.trimSpeed ? ' &nbsp;·&nbsp; Glide speed ' + fmt(an.trimSpeed, 1) + ' m/s' : '') + '</div>' +
      '<div style="margin-top:2mm"><svg xmlns="http://www.w3.org/2000/svg" width="110mm" height="10mm" viewBox="0 0 110 10"><line x1="5" y1="6" x2="105" y2="6" stroke="#000" stroke-width="0.5"/><line x1="5" y1="3" x2="5" y2="9" stroke="#000" stroke-width="0.5"/><line x1="105" y1="3" x2="105" y2="9" stroke="#000" stroke-width="0.5"/><text x="55" y="3.6" font-size="3" text-anchor="middle" font-family="Arial">100 mm — measure this line to check the print scale</text></svg></div>' +
      legendHTML() +
      '<div class="cvs" style="margin-top:2mm"><b>Pattern pages to tape together</b> (green boxes on the maps): ' + pageList + '</div>' +
      '<div class="maps">' + maps + '</div>' +
      '</div></div>';
    var g = gaugeSVG(d.wing.dihedral, 'Dihedral gauge', 'Each wing tip raised ' + d.wing.dihedral + '°');
    if (d.hstab.elevChord > 0 && Math.abs(d.hstab.elevUp) > 0.05) g += gaugeSVG(d.hstab.elevUp, 'Elevator gauge', (d.hstab.elevUp >= 0 ? 'Bend up ' : 'Bend down ') + Math.abs(d.hstab.elevUp) + '°');
    if (d.vstab.rudderChord > 0 && Math.abs(d.vstab.rudderRight) > 0.05) g += gaugeSVG(d.vstab.rudderRight, 'Rudder gauge', 'Bend ' + (d.vstab.rudderRight > 0 ? 'right ' : 'left ') + Math.abs(d.vstab.rudderRight) + '°');
    if (d.winglets.enabled && d.winglets.cant > 0.05) g += gaugeSVG(90 - d.winglets.cant, 'Winglet gauge', 'Angle from the wing: ' + (90 - d.winglets.cant) + '° (cant ' + d.winglets.cant + '°)');
    g += gaugeSVG(90, 'Square gauge', 'Fin to stabilizer, wing to fuselage', 28);
    var p2 = '<div class="cv" style="' + size + '"><div class="cvin">' +
      '<div class="cvt">BUILD STEPS · ' + esc(d.name || 'Untitled') + '</div>' +
      '<div class="gauges">' + g + '</div>' +
      '<div class="steps"><ol>' + buildSteps().map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div>' +
      '</div></div>';

  }

  function tilePageSVG(sheet, sIdx, lay, tl, t) {
    var x0 = tl.x0, y0 = tl.y0, s = [];
    s.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + PAGE.W + 'mm" height="' + PAGE.H + 'mm" viewBox="0 0 ' + PAGE.W + ' ' + PAGE.H + '">');
    s.push('<rect width="' + PAGE.W + '" height="' + PAGE.H + '" fill="#fff"/>');
    s.push('<svg x="' + PAGE.M + '" y="' + PAGE.M + '" width="' + PAGE.PW + '" height="' + PAGE.PH + '" viewBox="' + x0 + ' ' + y0 + ' ' + PAGE.PW + ' ' + PAGE.PH + '" overflow="hidden">');
    s.push(sheetContent(sheet, lay, { grid: true }));
    // overlap guides: where the next page to the right / below begins
    if (tl.c < t.cols - 1) s.push('<line x1="' + (x0 + PAGE.SX) + '" y1="' + y0 + '" x2="' + (x0 + PAGE.SX) + '" y2="' + (y0 + PAGE.PH) + '" stroke="#6a6" stroke-width="0.3" stroke-dasharray="2 2"/>' + svgText(x0 + PAGE.SX + PAGE.OV / 2, y0 + PAGE.PH / 2, 'overlap · page ' + ROWS[tl.r] + (tl.c + 2) + ' goes here', 2.6, 90, '#6a6'));
    if (tl.r < t.rows - 1) s.push('<line x1="' + x0 + '" y1="' + (y0 + PAGE.SY) + '" x2="' + (x0 + PAGE.PW) + '" y2="' + (y0 + PAGE.SY) + '" stroke="#6a6" stroke-width="0.3" stroke-dasharray="2 2"/>' + svgText(x0 + PAGE.PW / 2, y0 + PAGE.SY + PAGE.OV / 2, 'overlap · page ' + ROWS[tl.r + 1] + (tl.c + 1) + ' goes here', 2.6, 0, '#6a6'));
    s.push('</svg>');
    s.push('<rect x="' + PAGE.M + '" y="' + PAGE.M + '" width="' + PAGE.PW + '" height="' + PAGE.PH + '" fill="none" stroke="#bbb" stroke-width="0.25"/>');
    s.push('<rect x="' + (PAGE.M + 1) + '" y="' + (PAGE.M + 1) + '" width="62" height="7" fill="#fff" stroke="#000" stroke-width="0.25"/>');
    s.push(svgText(PAGE.M + 3, PAGE.M + 4.6, 'SHEET ' + (sIdx + 1) + ' · PAGE ' + tl.id + ' · ' + esc(state.design.name || ''), 3, 0, '#000', 'start', 'bold'));
    s.push('</svg>');
    return s.join('');
  }

  function renderTemplate() {
    var an = state.an, lay = an.layout;
    var prev = $('tplPreview');
    prev.style.flexDirection = 'column'; prev.style.justifyContent = 'flex-start';

    lay.sheets.forEach(function (sh, i) { h += '<div style="width:96%;max-width:980px;margin-bottom:8px">' + mapSVG(sh, i, lay, 0, true) + '</div>'; });

  function printTemplate() {
    var an = state.an, lay = an.layout;
    $('pageStyle').textContent = '@page{size:' + PAGE.W + 'mm ' + PAGE.H + 'mm;margin:0}' + COVER_CSS +
      '.tile{width:' + PAGE.W + 'mm;height:' + (PAGE.H - 1) + 'mm;overflow:hidden}.tile svg{display:block}';
    var pages = coverPages(true).map(function (h) { return '<div class="page">' + h + '</div>'; });
    lay.sheets.forEach(function (sh, i) {
      var t = tilesForSheet(sh, lay);
      t.tiles.forEach(function (tl) { if (tl.used) pages.push('<div class="page tile">' + tilePageSVG(sh, i, lay, tl, t) + '</div>'); });
    });
    $('printArea').innerHTML = pages.join('');
    setTimeout(function () { window.print(); }, 60);
  }
