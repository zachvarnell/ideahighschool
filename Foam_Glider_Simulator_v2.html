  function addTest() {
    var dist = parseFloat($('t_dist').value), time = parseFloat($('t_time').value);
    if (!isFinite(dist) && !isFinite(time)) { toast('Enter the measured distance or the time aloft.'); return; }
    var sim;
    try { sim = P.simulate(state.design); } catch (e) { sim = null; }
    var L = state.design.launch;
    state.design.tests.push({
      date: $('t_date').value || today(), team: $('t_team').value.trim(),
      distance: isFinite(dist) ? dist : null, time: isFinite(time) ? time : null,
      behavior: $('t_beh').value, notes: $('t_notes').value.trim(),
      predicted: sim ? { distance: +sim.distance.toFixed(3), time: +sim.timeAloft.toFixed(3), behavior: sim.behavior.key, launchSpeed: L.speed, launchAngle: L.angle, launchHeight: L.height } : null
    });
    autosave();
    $('t_dist').value = ''; $('t_time').value = ''; $('t_notes').value = '';
    renderTests();
    toast('Test flight added.');
  }
  function pctDiff(m, p) { if (m == null || p == null || p === 0) return null; return (m - p) / p * 100; }
  function renderTests() {
    var tests = state.design.tests;
    var h = '<table><thead><tr><th>#</th><th class="l">Date</th><th class="l">Thrower</th><th>Distance (m)<br>measured</th><th><br>predicted</th><th><br>difference</th><th>Time (s)<br>measured</th><th><br>predicted</th><th class="l">Flight type<br>measured</th><th class="l"><br>predicted</th><th></th></tr></thead><tbody>';
    if (!tests.length) h += '<tr><td colspan="11" class="l" style="color:#1d7a38;padding:10px">No test flights yet. Fly the real glider, measure it, and add the results on the left.</td></tr>';
    tests.forEach(function (t, i) {
      var p = t.predicted || {};
      var dd = pctDiff(t.distance, p.distance);
      h += '<tr><td>' + (i + 1) + '</td><td class="l">' + esc(t.date) + '</td><td class="l">' + esc(t.team) + '</td>' +
        '<td>' + fmt(t.distance, 2) + '</td><td>' + fmt(p.distance, 2) + '</td>' +
        '<td>' + (dd === null ? '—' : (dd >= 0 ? '+' : '') + dd.toFixed(0) + ' %') + '</td>' +
        '<td>' + fmt(t.time, 2) + '</td><td>' + fmt(p.time, 2) + '</td>' +
        '<td class="l">' + esc(behaviorName(t.behavior)) + '</td><td class="l">' + esc(behaviorName(p.behavior)) + '</td>' +
        '<td><button class="x" data-del="' + i + '" title="Delete this test flight">✕</button></td></tr>';
      if (t.notes) h += '<tr><td></td><td colspan="10" class="l" style="color:#1d7a38">' + esc(t.notes) + '</td></tr>';
    });
    h += '</tbody></table>';
    $('testTableWrap').innerHTML = h;
    Array.prototype.forEach.call($('testTableWrap').querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Delete test flight ' + (+b.getAttribute('data-del') + 1) + '?')) return;
        tests.splice(+b.getAttribute('data-del'), 1); autosave(); renderTests();
      });
    });
    // summary
    var md = [], pd = [], mt = [], pt = [], match = 0, nb = 0;
    tests.forEach(function (t) {
      var p = t.predicted || {};
      if (t.distance != null && p.distance != null) { md.push(t.distance); pd.push(p.distance); }
      if (t.time != null && p.time != null) { mt.push(t.time); pt.push(p.time); }
      if (p.behavior) { nb++; if (p.behavior === t.behavior) match++; }
    });
    function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
    var s = '<h2>COMPARISON</h2><div class="ro">' +
      '<span class="k">Test flights</span><span class="v">' + tests.length + '</span>' +
      '<span class="k">Average measured distance</span><span class="v">' + fmt(avg(md), 2) + ' m</span>' +
      '<span class="k">Average predicted distance</span><span class="v">' + fmt(avg(pd), 2) + ' m</span>' +
      '<span class="k">Average measured time</span><span class="v">' + fmt(avg(mt), 2) + ' s</span>' +
      '<span class="k">Average predicted time</span><span class="v">' + fmt(avg(pt), 2) + ' s</span>' +
      '<span class="k">Flight type matched</span><span class="v">' + (nb ? match + ' of ' + nb : '—') + '</span></div>' +
      '<div class="note" style="margin-top:6px">Points on the diagonal line below mean the prediction matched the real flight exactly. Points above the line flew farther than predicted.</div>';
    $('testSummary').innerHTML = s;
    drawTestChart(md, pd);
  }
  function drawTestChart(md, pd) {
    var cv = $('testChart'); if (!cv) return;
    var pr = prepCanvas(cv), ctx = pr.ctx, w = pr.w, h = pr.h;
    var mx = 1; md.concat(pd).forEach(function (v) { mx = Math.max(mx, v); }); mx = Math.ceil(mx * 1.15);
    var l = 34, r = 10, t = 10, b = 30, side = Math.min(w - l - r, h - t - b);
    function X(v) { return l + side * v / mx; } function Y(v) { return t + side - side * v / mx; }
    ctx.strokeStyle = C.faint; ctx.lineWidth = 1; ctx.strokeRect(l, t, side, side);
    for (var g = 0; g <= mx; g += Math.max(1, Math.round(mx / 5))) { text(ctx, String(g), X(g), t + side + 9, C.dim, 'center', 9); text(ctx, String(g), l - 4, Y(g), C.dim, 'right', 9); }
    ctx.setLineDash([5, 4]); vline(ctx, [[X(0), Y(0)], [X(mx), Y(mx)]], C.dim, 1, false, false); ctx.setLineDash([]);
    text(ctx, 'perfect prediction', X(mx * 0.45) + 6, Y(mx * 0.45) + 4, C.dim, 'left', 9);
    for (var i = 0; i < md.length; i++) { var x = X(pd[i]), y = Y(md[i]); ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * Math.PI); ctx.stroke(); }
    text(ctx, 'predicted distance (m) →', l + side / 2, t + side + 22, C.dim, 'center', 10);
    ctx.save(); ctx.translate(10, t + side / 2); ctx.rotate(-Math.PI / 2); text(ctx, 'measured distance (m) →', 0, 0, C.dim, 'center', 10); ctx.restore();
  }
  function exportCSV() {
    var tests = state.design.tests;
    if (!tests.length) { toast('There are no test flights to export yet.'); return; }
    function q(v) { v = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var rows = [['Flight', 'Date', 'Design', 'Thrower', 'Measured distance (m)', 'Predicted distance (m)', 'Distance difference (%)', 'Measured time (s)', 'Predicted time (s)', 'Measured flight', 'Predicted flight', 'Launch speed (m/s)', 'Launch angle (deg)', 'Launch height (m)', 'Notes']];
    tests.forEach(function (t, i) {
      var p = t.predicted || {}, dd = pctDiff(t.distance, p.distance);
      rows.push([i + 1, t.date, state.design.name, t.team, t.distance, p.distance, dd === null ? '' : dd.toFixed(1), t.time, p.time, behaviorName(t.behavior), behaviorName(p.behavior), p.launchSpeed, p.launchAngle, p.launchHeight, t.notes]);
    });
    download(safeName(state.design.name) + '-test-flights.csv', rows.map(function (r) { return r.map(q).join(','); }).join('\r\n'), 'text/csv');
  }

  /* =====================================================================
     FILES, TABS, START-UP
     ===================================================================== */
  function loadDesign(d, msg) {
    state.design = P.sanitize(d);
    state.sim = null; fcache = null;
    updateTitle();
    changed(true);
    renderAside();
    redrawTab();
    if (msg) toast(msg);
  }
  function saveFile() {
    var json = JSON.stringify(state.design, null, 2);
    download(safeName(state.design.name) + '.json', json, 'application/json');
    toast('Design saved to your Downloads folder.');
  }
  function openFile(file) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (!d || d.format !== 'foam-glider-design') throw new Error('This is not a foam glider design file.');
        loadDesign(d, 'Opened "' + (d.name || file.name) + '".');
      } catch (e) { toast('Could not open the file: ' + e.message); }
    };
    rd.readAsText(file);
  }
  function setTab(t) {
    state.tab = t;
    stopReplay();
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (s) { s.classList.toggle('on', s.id === 'tab-' + t); });
    renderAside();
    redrawTab();
  }
  function redrawTab() {
    if (state.tab === 'design') { drawDesign(); renderReadouts(); }
    else if (state.tab === 'flight') { renderResults(); fcache = null; drawFlightFrame(); }
    else if (state.tab === 'template') renderTemplate();
    else renderTests();
  }

  function init() {
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
      b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); });
    });
    var menu = $('exampleMenu');
    $('btnNew').addEventListener('click', function (e) { e.stopPropagation(); menu.style.display = menu.style.display === 'block' ? 'none' : 'block'; });
    document.addEventListener('click', function () { menu.style.display = 'none'; });
    Array.prototype.forEach.call(menu.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Start a new design? Save your current design first if you want to keep it.')) return;
        var ex = b.getAttribute('data-ex');
        loadDesign(ex === 'flat' ? exampleFlat() : (ex === 'winglets' ? exampleWinglets() : (ex === 'canard' ? exampleCanard() : P.exampleGlider())), 'New design started.');
      });
    });
    $('btnSave').addEventListener('click', saveFile);
    $('btnOpen').addEventListener('click', function () { $('fileInput').value = ''; $('fileInput').click(); });
    $('fileInput').addEventListener('change', function () { if (this.files && this.files[0]) openFile(this.files[0]); });
    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { fcache = null; redrawTab(); }, 150); });
    window.addEventListener('afterprint', function () { $('printArea').innerHTML = ''; });

    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.format === 'foam-glider-design') loadDesign(saved, 'Restored your last design.');
    else loadDesign(P.exampleGlider());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
